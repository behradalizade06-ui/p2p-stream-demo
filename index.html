<!DOCTYPE html>
<html>
<head>
  <title>Adaptive Tunnel Screen Stream</title>
  <meta name="viewport/npm/qrcode/build/qrcode.min.js"></script>  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>
    :root {
      --bg: #070b0a;
      --green: #00b050;
      --green2: #19d36f;
      --green3: #00853e;
      --text: #ffffff;
      --muted: #a8b8b2;
      --danger: #ff5c5c;
      --border: rgba(255,255,255,0.1);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(0,176,80,0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,176,80,0.10), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 22px rgba(0,176,80,0.85);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 42px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }

    .status {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(0,176,80,0.10);
      border: 1px solid rgba(0,176,80,0.25);
      color: var(--green2);
      font-weight: 800;
      white-space: pre-wrap;
    }

    .error {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,92,92,0.10);
      border: 1px solid rgba(255,92,92,0.25);
      color: var(--danger);
      font-weight: 800;
      white-space: pre-wrap;
      display: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--green3));
      box-shadow: 0 12px 28px rgba(0,176,80,0.28);
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.danger {
      background: linear-gradient(135deg, #ff5c5c, #b51f1f);
    }

    input {
      width: 100%;
      padding: 15px 16px;
      margin: 8px 0 12px;
      font-size: 15px;
      color: white;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
    }

    p {
      color: var(--muted);
      margin: 0 0 8px;
    }

    .viewer {
      margin-top: 16px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      height: 72dvh;
      min-height: 300px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #remoteCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    #hiddenVideo,
    #captureCanvas {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 320px;
      height: 180px;
      opacity: 0.01;
      pointer-events: none;
    }

    .viewer:fullscreen {
      width: 100vw;
      height: 100dvh;
      margin: 0;
      border-radius: 0;
      border: 0;
      background: #000;
      display: flex !important;
    }

    .viewer:fullscreen #remoteCanvas {
      width: 100vw;
      height: 100dvh;
    }

    #qrWrap {
      margin-top: 16px;
      display: none;
    }

    #qrBox {
      display: inline-block;
      padding: 16px;
      border-radius: 22px;
      background: white;
    }

    #tabletOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #000;
      color: white;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    #tabletOverlay h2 {
      color: var(--green2);
      font-size: 32px;
      margin: 0 0 12px;
    }

    #tabletOverlay p {
      color: white;
      font-size: 18px;
      line-height: 1.4;
    }

    @media (orientation: portrait) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .viewer {
        height: 72dvh;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <div class="header">
    <div>
      <div class="brand">
        <div class="dot"></div>
        <h1>Screen Stream</h1>
      </div>
      <div class="subtitle">Adaptive stream · feedback optimized for fluidity</div>
    </div>

    <button class="secondary" onclick="fullscreenViewer()">Fullscreen</button>
  </div>

  <div class="panel">
    <div id="status" class="status">Loading...</div>
    <div id="error" class="error"></div>

    <div id="setupBox" class="panel" style="display:none;">
      <p>Paste Cloudflare tunnel URL:</p>

      <input
        id="serverInput"
        placeholder="https://xxxxx.trycloudflare.com OR wss://xxxxx.trycloudflare.com"
      >

      <div class="controls">
        <button onclick="openAsTablet()">Open as Tablet</button>
        <button class="secondary" onclick="openAsClient()">Open as Client</button>
      </div>
    </div>

    <div class="controls">
      <button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>
      <button id="stopTabletBtn" class="danger" style="display:none;">Stop Stream</button>
      <button id="fullscreenBtn" class="secondary" style="display:none;" onclick="fullscreenViewer()">Fullscreen</button>
    </div>

    <div id="qrWrap">
      <h3>Client QR</h3>
      <div id="qrBox">
        <canvas id="qr"></canvas>
      </div>
    </div>

    <div id="remoteViewer" class="viewer">
      <canvas id="remoteCanvas"></canvas>
    </div>
  </div>
</div>

<div id="tabletOverlay">
  <div>
    <h2>Streaming Active</h2>
    <p>Adaptive mode active.</p>
    <p>Now switch to the real tablet content.</p>
  </div>
</div>

<video id="hiddenVideo" autoplay muted playsinline></video>
<canvas id="captureCanvas"></canvas>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
let serverUrl = params.get("server");

const setupBox = document.getElementById("setupBox");
const serverInput = document.getElementById("serverInput");

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startTabletBtn = document.getElementById("startTabletBtn");
const stopTabletBtn = document.getElementById("stopTabletBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");

const qrWrap = document.getElementById("qrWrap");
const qrCanvas = document.getElementById("qr");

const remoteViewer = document.getElementById("remoteViewer");
const remoteCanvas = document.getElementById("remoteCanvas");
const remoteCtx = remoteCanvas.getContext("2d", { alpha: false });

const hiddenVideo = document.getElementById("hiddenVideo");
const captureCanvas = document.getElementById("captureCanvas");
const captureCtx = captureCanvas.getContext("2d", { alpha: false });

const tabletOverlay = document.getElementById("tabletOverlay");

let ws = null;
let localStream = null;
let streaming = false;
let encoding = false;
let frameCount = 0;
let lastImage = null;
let lastFrameTime = 0;
let seq = 0;

const MIME_TYPE = "image/jpeg";

const profiles = [
  { name: "ULTRA_FLUID", fps: 20, quality: 0.32, maxWidth: 640, bufferLimit: 350 * 1024 },
  { name: "FAST",        fps: 18, quality: 0.38, maxWidth: 720, bufferLimit: 500 * 1024 },
  { name: "BALANCED",    fps: 16, quality: 0.45, maxWidth: 854, bufferLimit: 700 * 1024 },
  { name: "QUALITY",     fps: 14, quality: 0.55, maxWidth: 960, bufferLimit: 950 * 1024 },
  { name: "HIGH",        fps: 12, quality: 0.62, maxWidth: 1100, bufferLimit: 1200 * 1024 }
];

let profileIndex = 2;
let currentProfile = profiles[profileIndex];

let feedbackHistory = [];
let lastAdaptAt = 0;

let clientDelaySamples = [];
let clientFramesThisSecond = 0;
let clientDroppedFrames = 0;
let clientLastFeedbackAt = Date.now();

if (role === "tablet") {
  startTabletBtn.style.display = "inline-block";
}

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  if (!text) {
    errorBox.style.display = "none";
    errorBox.innerText = "";
    return;
  }

  errorBox.style.display = "block";
  errorBox.innerText = text;
}

function normalizeServerUrl(url) {
  if (!url) return null;

  url = url.trim();

  if (url.startsWith("https://")) return url.replace("https://", "wss://");
  if (url.startsWith("http://")) return url.replace("http://", "ws://");
  if (url.startsWith("wss://") || url.startsWith("ws://")) return url;

  return "wss://" + url;
}

function buildUrl(newRole) {
  const cleanServer = normalizeServerUrl(serverInput.value);

  if (!cleanServer) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(cleanServer)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function sendJson(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function connectWebSocket() {
  if (!serverUrl) {
    setupBox.style.display = "block";
    setStatus("Insert tunnel URL and choose Tablet or Client");
    return;
  }

  serverUrl = normalizeServerUrl(serverUrl);

  setStatus("Connecting to tunnel:\n" + serverUrl);

  ws = new WebSocket(serverUrl);

  ws.onopen = () => {
    sendJson({
      type: "join",
      role,
      room
    });

    setStatus("Connected to tunnel");
  };

  ws.onerror = () => {
    setError("WebSocket error:\n" + serverUrl);
  };

  ws.onclose = (event) => {
    setStatus("Disconnected from tunnel\nCode: " + event.code);
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "joined") {
      if (role === "tablet") initTablet();
      if (role === "client") initClient();
    }

    if (msg.type === "stream-start") {
      if (role === "client") {
        remoteViewer.style.display = "flex";
        setStatus("Receiving screen...");
      }
    }

    if (msg.type === "frame") {
      if (role === "client") {
        handleClientFrame(msg);
      }
    }

    if (msg.type === "feedback") {
      if (role === "tablet") {
        handleTabletFeedback(msg);
      }
    }

    if (msg.type === "stream-stop") {
      if (role === "client") {
        clearRemote();
        setStatus("Stream stopped");
      }
    }
  };
}

function initTablet() {
  setStatus("Tablet connected. Press Start Tablet Screen.");

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";

  const clientUrl =
    window.location.origin +
    window.location.pathname +
    "?role=client" +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(serverUrl);

  qrWrap.style.display = "block";

  try {
    QRCode.toCanvas(qrCanvas, clientUrl);
  } catch {
    setError("QR generation failed, but streaming button is active.");
  }
}

function initClient() {
  setStatus("Client connected. Waiting for stream...");
  fullscreenBtn.style.display = "inline-block";
  remoteViewer.style.display = "flex";
  resizeRemoteCanvas();
}

async function startTabletScreen() {
  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: 20,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    hiddenVideo.srcObject = localStream;
    await hiddenVideo.play();

    await new Promise(resolve => {
      if (hiddenVideo.videoWidth > 0) {
        resolve();
        return;
      }

      hiddenVideo.onloadedmetadata = () => resolve();
    });

    streaming = true;

    sendJson({
      type: "stream-start"
    });

    startTabletBtn.style.display = "none";
    stopTabletBtn.style.display = "inline-block";
    tabletOverlay.style.display = "flex";

    localStream.getVideoTracks()[0].onended = () => {
      stopTabletStream();
    };

    requestAnimationFrame(frameLoop);

    updateTabletStatus();

  } catch (err) {
    setError("Screen share failed:\n" + (err.message || err.name || err));
  }
}

function frameLoop(timestamp) {
  if (!streaming) return;

  const frameInterval = 1000 / currentProfile.fps;

  if (!lastFrameTime || timestamp - lastFrameTime >= frameInterval) {
    lastFrameTime = timestamp;
    sendFrame();
  }

  requestAnimationFrame(frameLoop);
}

function sendFrame() {
  if (encoding) return;
  if (!hiddenVideo.videoWidth || !hiddenVideo.videoHeight) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  if (ws.bufferedAmount > currentProfile.bufferLimit) {
    return;
  }

  encoding = true;

  let width = hiddenVideo.videoWidth;
  let height = hiddenVideo.videoHeight;

  if (width > currentProfile.maxWidth) {
    const scale = currentProfile.maxWidth / width;
    width = currentProfile.maxWidth;
    height = Math.round(height * scale);
  }

  captureCanvas.width = width;
  captureCanvas.height = height;

  captureCtx.drawImage(hiddenVideo, 0, 0, width, height);

  const dataUrl = captureCanvas.toDataURL(MIME_TYPE, currentProfile.quality);

  encoding = false;
  seq++;

  sendJson({
    type: "frame",
    seq,
    sentAt: Date.now(),
    width,
    height,
    profile: currentProfile.name,
    dataUrl
  });
}

function handleClientFrame(msg) {
  const now = Date.now();
  const delay = now - msg.sentAt;

  clientDelaySamples.push(delay);

  if (clientDelaySamples.length > 30) {
    clientDelaySamples.shift();
  }

  clientFramesThisSecond++;

  drawFrame(msg.dataUrl);

  if (now - clientLastFeedbackAt >= 1000) {
    const avgDelay =
      clientDelaySamples.reduce((sum, value) => sum + value, 0) /
      Math.max(1, clientDelaySamples.length);

    sendJson({
      type: "feedback",
      avgDelay: Math.round(avgDelay),
      lastDelay: delay,
      receivedFps: clientFramesThisSecond,
      droppedFrames: clientDroppedFrames,
      clientBuffered: 0
    });

    clientFramesThisSecond = 0;
    clientDroppedFrames = 0;
    clientLastFeedbackAt = now;
  }
}

function handleTabletFeedback(msg) {
  feedbackHistory.push(msg);

  if (feedbackHistory.length > 5) {
    feedbackHistory.shift();
  }

  const now = Date.now();

  if (now - lastAdaptAt < 1200) {
    return;
  }

  lastAdaptAt = now;

  const avgDelay =
    feedbackHistory.reduce((sum, item) => sum + item.avgDelay, 0) /
    Math.max(1, feedbackHistory.length);

  const avgFps =
    feedbackHistory.reduce((sum, item) => sum + item.receivedFps, 0) /
    Math.max(1, feedbackHistory.length);

  if (avgDelay > 1000) {
    profileIndex = Math.max(0, profileIndex - 2);
    currentProfile = profiles[profileIndex];
    updateTabletStatus("Delay > 1s, aggressive fluidity mode");
    return;
  }

  if (avgDelay > 700) {
    profileIndex = Math.max(0, profileIndex - 1);
    currentProfile = profiles[profileIndex];
    updateTabletStatus("High delay, reducing resolution");
    return;
  }

  if (avgDelay < 420 && avgFps >= currentProfile.fps * 0.75) {
    profileIndex = Math.min(profiles.length - 1, profileIndex + 1);
    currentProfile = profiles[profileIndex];
    updateTabletStatus("Stable, increasing quality slowly");
    return;
  }

  updateTabletStatus("Adaptive stable");
}

function updateTabletStatus(reason) {
  const text =
    "Streaming adaptive mode\n" +
    "Profile: " + currentProfile.name + "\n" +
    "FPS: " + currentProfile.fps + "\n" +
    "Width: " + currentProfile.maxWidth + "\n" +
    "Quality: " + currentProfile.quality +
    (reason ? "\n" + reason : "");

  setStatus(text);
}

function drawFrame(dataUrl) {
  const img = new Image();

  img.onload = () => {
    lastImage = img;

    resizeRemoteCanvas();
    renderContain(img);

    remoteViewer.style.display = "flex";

    frameCount++;

    if (frameCount === 1) {
      setStatus("Screen received ✅");
    }
  };

  img.onerror = () => {
    clientDroppedFrames++;
  };

  img.src = dataUrl;
}

function resizeRemoteCanvas() {
  const rect = remoteViewer.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  const width = Math.max(1, Math.floor(rect.width * dpr));
  const height = Math.max(1, Math.floor(rect.height * dpr));

  if (remoteCanvas.width !== width || remoteCanvas.height !== height) {
    remoteCanvas.width = width;
    remoteCanvas.height = height;
  }
}

function renderContain(img) {
  const canvasW = remoteCanvas.width;
  const canvasH = remoteCanvas.height;

  const imgW = img.naturalWidth;
  const imgH = img.naturalHeight;

  const scale = Math.min(canvasW / imgW, canvasH / imgH);

  const drawW = imgW * scale;
  const drawH = imgH * scale;

  const x = (canvasW - drawW) / 2;
  const y = (canvasH - drawH) / 2;

  remoteCtx.fillStyle = "#000";
  remoteCtx.fillRect(0, 0, canvasW, canvasH);
  remoteCtx.drawImage(img, x, y, drawW, drawH);
}

function clearRemote() {
  remoteCtx.clearRect(0, 0, remoteCanvas.width, remoteCanvas.height);
  remoteViewer.style.display = "none";
  frameCount = 0;
}

function stopTabletStream() {
  streaming = false;

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }

  localStream = null;
  hiddenVideo.srcObject = null;

  sendJson({
    type: "stream-stop"
  });

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";
  tabletOverlay.style.display = "none";

  setStatus("Stream stopped");
}

async function fullscreenViewer() {
  remoteViewer.style.display = "flex";
  resizeRemoteCanvas();

  try {
    await remoteViewer.requestFullscreen();
  } catch {}
}

window.addEventListener("resize", () => {
  if (lastImage) {
    resizeRemoteCanvas();
    renderContain(lastImage);
  }
});

document.addEventListener("fullscreenchange", () => {
  if (lastImage) {
    setTimeout(() => {
      resizeRemoteCanvas();
      renderContain(lastImage);
    }, 150);
  }
});

startTabletBtn.onclick = startTabletScreen;
stopTabletBtn.onclick = stopTabletStream;

if (!role || !serverUrl) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
