<!DOCTYPE html>
<html>
<head>
  <title>PeerJS Tablet Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 16px;
      margin: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    input {
      width: 95%;
      max-width: 700px;
      padding: 10px;
      margin: 6px 0;
      font-size: 14px;
    }

    video {
      width: 100%;
      max-width: 900px;
      background: black;
      margin-top: 15px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #0a5;
      white-space: pre-wrap;
    }

    #error {
      margin-top: 15px;
      font-weight: bold;
      color: red;
      white-space: pre-wrap;
    }

    .box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
    }

    #qr {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h2>PeerJS Tablet Screen Stream</h2>

<div id="status">Loading...</div>
<div id="error"></div>

<div id="setupBox" class="box" style="display:none;">
  <h3>Setup</h3>

  <p>Paste Cloudflare tunnel URL:</p>

  <input
    id="peerHostInput"
    placeholder="https://xxxxx.trycloudflare.com"
  >

  <br>

  <button onclick="openAsTablet()">Open as Tablet</button>
  <button onclick="openAsClient()">Open as Client</button>
</div>

<button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>

<h3 id="qrTitle" style="display:none;">Client QR</h3>
<canvas id="qr" style="display:none;"></canvas>

<video id="localVideo" autoplay muted playsinline style="display:none;"></video>
<video id="remoteVideo" autoplay playsinline controls style="display:none;"></video>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
const peerHostRaw = params.get("peerhost");

const setupBox = document.getElementById("setupBox");
const peerHostInput = document.getElementById("peerHostInput");
const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startTabletBtn = document.getElementById("startTabletBtn");
const qrTitle = document.getElementById("qrTitle");
const qrCanvas = document.getElementById("qr");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

let peer = null;
let localStream = null;

let clientIds = new Set();
let clientConnections = {};

const TABLET_ID = "tablet-" + room;

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  errorBox.innerText = text;
}

function clearError() {
  errorBox.innerText = "";
}

function normalizePeerHost(input) {
  if (!input) return null;

  let value = input.trim();

  value = value.replace("https://", "");
  value = value.replace("http://", "");
  value = value.replace("wss://", "");
  value = value.replace("ws://", "");
  value = value.replace(/\/$/, "");

  return value;
}

function buildUrl(newRole) {
  const host = normalizePeerHost(peerHostInput.value);

  if (!host) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&peerhost=" +
    encodeURIComponent("https://" + host)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function createPeer(peerId) {
  const host = normalizePeerHost(peerHostRaw);

  if (!host) {
    setError("Missing PeerJS tunnel host");
    return null;
  }

  return new Peer(peerId, {
    host: host,
    port: 443,
    path: "/peerjs",
    secure: true,
    key: "peerjs",
    debug: 3,
    pingInterval: 5000,
    config: {
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        },

        // TURN over UDP 80
        {
          urls: "turn:openrelay.metered.ca:80",
          username: "openrelayproject",
          credential: "openrelayproject"
        },

        // TURN over TCP 80
        {
          urls: "turn:openrelay.metered.ca:80?transport=tcp",
          username: "openrelayproject",
          credential: "openrelayproject"
        },

        // TURN over UDP 443
        {
          urls: "turn:openrelay.metered.ca:443",
          username: "openrelayproject",
          credential: "openrelayproject"
        },

        // TURN over TCP 443
        {
          urls: "turn:openrelay.metered.ca:443?transport=tcp",
          username: "openrelayproject",
          credential: "openrelayproject"
        }
      ]
    }
  });
}


function initTablet() {
  clearError();

  peer = createPeer(TABLET_ID);

  peer.on("open", (id) => {
    setStatus("Tablet connected as: " + id + "\nPress Start Tablet Screen.");

    startTabletBtn.style.display = "inline-block";

    const clientUrl =
      window.location.origin +
      window.location.pathname +
      "?role=client" +
      "&room=" +
      encodeURIComponent(room) +
      "&peerhost=" +
      encodeURIComponent(peerHostRaw);

    qrTitle.style.display = "block";
    qrCanvas.style.display = "block";

    QRCode.toCanvas(qrCanvas, clientUrl);
  });

  peer.on("connection", (conn) => {
    clientConnections[conn.peer] = conn;
    clientIds.add(conn.peer);

    setStatus("Client registered: " + conn.peer);

    conn.on("data", (data) => {
      if (data && data.type === "client-ready") {
        clientIds.add(conn.peer);

        if (localStream) {
          callClient(conn.peer);
        } else {
          setStatus("Client ready. Start tablet screen.");
        }
      }
    });

    conn.on("close", () => {
      delete clientConnections[conn.peer];
      clientIds.delete(conn.peer);
      setStatus("Client disconnected: " + conn.peer);
    });
  });

  peer.on("error", (err) => {
    console.error(err);

    if (err.type === "unavailable-id") {
      setError(
        "Tablet ID already exists.\n" +
        "Close the old tablet page or restart PeerJS server."
      );
    } else {
      setError("PeerJS tablet error:\n" + err.message);
    }
  });

  peer.on("disconnected", () => {
    setStatus("Tablet disconnected from PeerJS server");
  });
}

async function startTabletScreen() {
  clearError();

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      setError(
        "Screen sharing is not supported on this browser/device.\n" +
        "Try Chrome/Edge desktop, or another tablet/browser that supports screen capture."
      );
      return;
    }

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: 30
      },
      audio: false
    });

    localVideo.srcObject = localStream;
    localVideo.style.display = "block";

    localStream.getVideoTracks()[0].onended = () => {
      setStatus("Tablet screen sharing stopped");
      localStream = null;
    };

    setStatus("Tablet screen sharing active.\nCalling clients...");

    for (const clientId of clientIds) {
      callClient(clientId);
    }

  } catch (err) {
    console.error(err);
    setError("Screen share failed:\n" + (err.message || err.name || err));
  }
}

function callClient(clientId) {
  if (!localStream) {
    setStatus("No tablet screen stream yet.");
    return;
  }

  setStatus("Calling client: " + clientId);

  const call = peer.call(clientId, localStream);

  call.on("stream", () => {
    setStatus("Streaming to client: " + clientId);
  });

  call.on("close", () => {
    setStatus("Call closed with client: " + clientId);
  });

  call.on("error", (err) => {
    console.error(err);
    setError("Call error with client " + clientId + ":\n" + err.message);
  });
}

function initClient() {
  clearError();

  const clientId =
    "client-" +
    room +
    "-" +
    Math.random().toString(36).slice(2);

  peer = createPeer(clientId);

  peer.on("open", (id) => {
    setStatus("Client connected as: " + id + "\nRegistering with tablet...");

    const conn = peer.connect(TABLET_ID);

    conn.on("open", () => {
      conn.send({
        type: "client-ready",
        clientId: id
      });

      setStatus("Client ready. Waiting for tablet call...");
    });

    conn.on("error", (err) => {
      console.error(err);
      setError("Data connection error:\n" + err.message);
    });
  });

  peer.on("call", (call) => {
    setStatus("Incoming tablet stream...");

    call.answer();

    call.on("stream", (stream) => {
      remoteVideo.srcObject = stream;
      remoteVideo.style.display = "block";
      remoteVideo.play().catch(() => {});
      setStatus("Receiving tablet screen");
    });

    call.on("close", () => {
      setStatus("Stream closed");
    });

    call.on("error", (err) => {
      console.error(err);
      setError("Stream call error:\n" + err.message);
    });
  });

  peer.on("error", (err) => {
    console.error(err);
    setError("PeerJS client error:\n" + err.message);
  });

  peer.on("disconnected", () => {
    setStatus("Client disconnected from PeerJS server");
  });
}

startTabletBtn.onclick = startTabletScreen;

if (!role || !peerHostRaw) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  if (role === "tablet") {
    initTablet();
  } else if (role === "client") {
    initClient();
  } else {
    setError("Invalid role");
  }
}
</script>

</body>
</html>
