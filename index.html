<!DOCTYPE html>
<html>
<head>
  <title>WebRTC Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #070b0a;
      --panel: #101715;
      --green: #00b050;
      --green2: #19d36f;
      --green3: #00853e;
      --text: #ffffff;
      --muted: #a8b8b2;
      --danger: #ff5c5c;
      --border: rgba(255,255,255,0.1);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(0,176,80,0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,176,80,0.10), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 22px rgba(0,176,80,0.85);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 42px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }

    .status {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(0,176,80,0.10);
      border: 1px solid rgba(0,176,80,0.25);
      color: var(--green2);
      font-weight: 800;
      white-space: pre-wrap;
    }

    .error {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,92,92,0.10);
      border: 1px solid rgba(255,92,92,0.25);
      color: var(--danger);
      font-weight: 800;
      white-space: pre-wrap;
      display: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--green3));
      box-shadow: 0 12px 28px rgba(0,176,80,0.28);
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.danger {
      background: linear-gradient(135deg, #ff5c5c, #b51f1f);
    }

    input {
      width: 100%;
      padding: 15px 16px;
      margin: 8px 0 12px;
      font-size: 15px;
      color: white;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
    }

    p {
      color: var(--muted);
      margin: 0 0 8px;
    }

    .viewer {
      margin-top: 16px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      height: 70dvh;
      min-height: 300px;
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
      object-fit: contain;
      transform-origin: center center;
    }

    #localViewer {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 320px;
      height: 180px;
      opacity: 0.01;
      pointer-events: none;
      display: flex;
    }

    #localVideo {
      width: 320px;
      height: 180px;
      opacity: 0.01;
    }

    #remoteViewer {
      background: #000;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #qrWrap {
      margin-top: 16px;
      display: none;
    }

    #qrBox {
      display: inline-block;
      padding: 16px;
      border-radius: 22px;
      background: white;
    }

    .viewer-toolbar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 999999;
      display: none;
      gap: 8px;
      justify-content: center;
      pointer-events: auto;
    }

    .viewer-toolbar button {
      padding: 11px 14px;
      font-size: 13px;
      background: rgba(0,176,80,0.92);
      backdrop-filter: blur(10px);
    }

    .viewer:fullscreen {
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border-radius: 0;
      border: 0;
      background: #000;
      display: flex !important;
    }

    .viewer:fullscreen video {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      object-fit: contain;
      background: #000;
    }

    .viewer.fullscreen-fallback {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 99999;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #000;
      display: flex !important;
    }

    .viewer.fullscreen-fallback video {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      object-fit: contain;
    }

    .rotated {
      transform: rotate(90deg);
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: contain !important;
    }

    @media (orientation: portrait) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <div class="header">
    <div>
      <div class="brand">
        <div class="dot"></div>
        <h1>Screen Stream</h1>
      </div>
      <div class="subtitle">WebRTC stream · tunnel signaling · internet clients</div>
    </div>

    <button class="secondary" onclick="enterViewerFullscreen()">Fullscreen</button>
  </div>

  <div class="panel">
    <div id="status" class="status">Loading...</div>
    <div id="error" class="error"></div>

    <div id="setupBox" class="panel" style="display:none;">
      <p>Paste Cloudflare tunnel URL:</p>

      <input
        id="serverInput"
        placeholder="https://xxxxx.trycloudflare.com OR wss://xxxxx.trycloudflare.com"
      >

      <div class="controls">
        <button onclick="openAsTablet()">Open as Tablet</button>
        <button class="secondary" onclick="openAsClient()">Open as Client</button>
      </div>
    </div>

    <div class="controls">
      <button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>
      <button id="stopTabletBtn" class="danger" style="display:none;">Stop Stream</button>
      <button id="fullscreenBtn" class="secondary" style="display:none;" onclick="enterViewerFullscreen()">Fullscreen</button>
      <button id="rotateBtn" class="secondary" style="display:none;" onclick="toggleRotate()">Rotate View</button>
      <button id="audioBtn" class="secondary" style="display:none;" onclick="enableAudio()">Enable Audio</button>
      <button id="retryBtn" class="secondary" style="display:none;" onclick="retryClient()">Retry</button>
    </div>

    <div id="qrWrap">
      <h3>Client QR</h3>
      <div id="qrBox">
        <canvas id="qr"></canvas>
      </div>
    </div>

    <div id="localViewer" class="viewer">
      <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <div id="remoteViewer" class="viewer">
      <video id="remoteVideo" autoplay muted playsinline></video>
    </div>
  </div>
</div>

<div id="viewerToolbar" class="viewer-toolbar">
  <button onclick="exitViewerFullscreen()">Exit</button>
  <button onclick="toggleRotate()">Rotate</button>
  <button onclick="enableAudio()">Audio</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
let serverUrl = params.get("server");

const setupBox = document.getElementById("setupBox");
const serverInput = document.getElementById("serverInput");

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startTabletBtn = document.getElementById("startTabletBtn");
const stopTabletBtn = document.getElementById("stopTabletBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const rotateBtn = document.getElementById("rotateBtn");
const audioBtn = document.getElementById("audioBtn");
const retryBtn = document.getElementById("retryBtn");

const qrWrap = document.getElementById("qrWrap");
const qrCanvas = document.getElementById("qr");

const localViewer = document.getElementById("localViewer");
const remoteViewer = document.getElementById("remoteViewer");
const viewerToolbar = document.getElementById("viewerToolbar");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

let ws = null;
let localStream = null;
let peers = {};
let pendingClients = new Set();
let rotated = false;
let clientIdSelf = null;

let clientIceQueue = [];
let tabletIceQueues = {};

function buildRtcConfig(forceRelay) {
  return {
    iceTransportPolicy: forceRelay ? "relay" : "all",
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },

      {
        urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject",
        credential: "openrelayproject"
      },
      {
        urls: "turn:openrelay.metered.ca:80?transport=tcp",
        username: "openrelayproject",
        credential: "openrelayproject"
      },
      {
        urls: "turn:openrelay.metered.ca:443",
        username: "openrelayproject",
        credential: "openrelayproject"
      },
      {
        urls: "turn:openrelay.metered.ca:443?transport=tcp",
        username: "openrelayproject",
        credential: "openrelayproject"
      },
      {
        urls: "turns:openrelay.metered.ca:443?transport=tcp",
        username: "openrelayproject",
        credential: "openrelayproject"
      }
    ]
  };
}

let forceRelayMode = false;

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  if (!text) {
    errorBox.style.display = "none";
    errorBox.innerText = "";
    return;
  }

  errorBox.style.display = "block";
  errorBox.innerText = text;
}

function normalizeServerUrl(url) {
  if (!url) return null;

  url = url.trim();

  if (url.startsWith("https://")) {
    return url.replace("https://", "wss://");
  }

  if (url.startsWith("http://")) {
    return url.replace("http://", "ws://");
  }

  if (url.startsWith("wss://") || url.startsWith("ws://")) {
    return url;
  }

  return "wss://" + url;
}

function buildUrl(newRole) {
  const cleanServer = normalizeServerUrl(serverInput.value);

  if (!cleanServer) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(cleanServer)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

async function enterViewerFullscreen() {
  const viewer = role === "tablet" ? localViewer : remoteViewer;

  viewer.style.display = "flex";
  viewerToolbar.style.display = "flex";

  try {
    await viewer.requestFullscreen();
  } catch {
    viewer.classList.add("fullscreen-fallback");
  }

  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("portrait");
    }
  } catch {}
}

async function exitViewerFullscreen() {
  viewerToolbar.style.display = "none";

  if (document.fullscreenElement) {
    await document.exitFullscreen();
  }

  localViewer.classList.remove("fullscreen-fallback");
  remoteViewer.classList.remove("fullscreen-fallback");
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    viewerToolbar.style.display = "none";
    localViewer.classList.remove("fullscreen-fallback");
    remoteViewer.classList.remove("fullscreen-fallback");
  } else {
    viewerToolbar.style.display = "flex";
  }
});

function toggleRotate() {
  rotated = !rotated;

  if (rotated) {
    localVideo.classList.add("rotated");
    remoteVideo.classList.add("rotated");
  } else {
    localVideo.classList.remove("rotated");
    remoteVideo.classList.remove("rotated");
  }
}

async function enableAudio() {
  try {
    remoteVideo.muted = false;
    remoteVideo.volume = 1;
    await remoteVideo.play();
    setStatus("Audio enabled");
  } catch (err) {
    setError("Audio enable failed:\n" + (err.message || err.name || err));
  }
}

function retryClient() {
  forceRelayMode = !forceRelayMode;

  if (peers.main) {
    peers.main.close();
    peers.main = null;
  }

  clientIceQueue = [];
  remoteVideo.srcObject = null;
  remoteViewer.style.display = "none";

  send({ type: "client-ready" });

  setStatus(forceRelayMode ? "Retrying with TURN relay..." : "Retrying normal WebRTC...");
}

function connectWebSocket() {
  if (!serverUrl) {
    setupBox.style.display = "block";
    setStatus("Insert tunnel URL and choose Tablet or Client");
    return;
  }

  serverUrl = normalizeServerUrl(serverUrl);
  setStatus("Connecting to signaling tunnel:\n" + serverUrl);

  ws = new WebSocket(serverUrl);

  ws.onopen = () => {
    send({
      type: "join",
      role,
      room
    });

    setStatus("Connected to signaling tunnel");
  };

  ws.onerror = () => {
    setError("WebSocket signaling error\n\n" + serverUrl);
  };

  ws.onclose = (event) => {
    setStatus("Disconnected from signaling tunnel\nCode: " + event.code);
  };

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "joined") {
      if (role === "tablet") initTabletUi();

      if (role === "client") {
        clientIdSelf = msg.id;
        initClientUi();
        send({ type: "client-ready" });
      }
    }

    if (msg.type === "client-joined") {
      if (role === "tablet") {
        if (localStream) {
          await createOfferForClient(msg.clientId);
        } else {
          pendingClients.add(msg.clientId);
          setStatus("Client waiting. Start tablet screen.");
        }
      }
    }

    if (msg.type === "offer") {
      if (role === "client") {
        await receiveOffer(msg.offer);
      }
    }

    if (msg.type === "answer") {
      if (role === "tablet") {
        const pc = peers[msg.clientId];

        if (pc) {
          await pc.setRemoteDescription(msg.answer);

          if (tabletIceQueues[msg.clientId]) {
            for (const c of tabletIceQueues[msg.clientId]) {
              try {
                await pc.addIceCandidate(c);
              } catch {}
            }

            tabletIceQueues[msg.clientId] = [];
          }
        }
      }
    }

    if (msg.type === "ice") {
      if (role === "tablet") {
        const pc = peers[msg.clientId];

        if (pc && pc.remoteDescription) {
          try {
            await pc.addIceCandidate(msg.candidate);
          } catch {}
        } else {
          if (!tabletIceQueues[msg.clientId]) tabletIceQueues[msg.clientId] = [];
          tabletIceQueues[msg.clientId].push(msg.candidate);
        }
      }

      if (role === "client") {
        const pc = peers.main;

        if (pc && pc.remoteDescription) {
          try {
            await pc.addIceCandidate(msg.candidate);
          } catch {}
        } else {
          clientIceQueue.push(msg.candidate);
        }
      }
    }

    if (msg.type === "client-left") {
      if (role === "tablet") {
        pendingClients.delete(msg.clientId);

        const pc = peers[msg.clientId];

        if (pc) {
          pc.close();
          delete peers[msg.clientId];
        }

        delete tabletIceQueues[msg.clientId];
      }
    }
  };
}

function initTabletUi() {
  setStatus("Tablet connected. Press Start Tablet Screen.");

  startTabletBtn.style.display = "inline-block";
  fullscreenBtn.style.display = "none";
  rotateBtn.style.display = "none";
  audioBtn.style.display = "none";
  retryBtn.style.display = "none";

  const clientUrl =
    window.location.origin +
    window.location.pathname +
    "?role=client" +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(serverUrl);

  qrWrap.style.display = "block";
  QRCode.toCanvas(qrCanvas, clientUrl);
}

function initClientUi() {
  setStatus("Client connected. Waiting for tablet stream...");

  fullscreenBtn.style.display = "inline-block";
  rotateBtn.style.display = "inline-block";
  audioBtn.style.display = "inline-block";
  retryBtn.style.display = "inline-block";
}

async function startTabletScreen() {
  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: 30,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: true
    });

    localVideo.srcObject = localStream;
    localVideo.muted = true;
    localVideo.playsInline = true;

    localViewer.style.display = "flex";

    try {
      await localVideo.play();
    } catch {}

    startTabletBtn.style.display = "none";
    stopTabletBtn.style.display = "inline-block";

    localStream.getVideoTracks()[0].onended = () => {
      stopTabletStream();
    };

    for (const clientId of pendingClients) {
      await createOfferForClient(clientId);
    }

    pendingClients.clear();

    setStatus("Streaming WebRTC video/audio");

  } catch (err) {
    setError("Screen share failed:\n" + (err.message || err.name || err));
  }
}

async function createOfferForClient(clientId) {
  if (!localStream) {
    pendingClients.add(clientId);
    return;
  }

  if (peers[clientId]) {
    peers[clientId].close();
    delete peers[clientId];
  }

  const pc = new RTCPeerConnection(buildRtcConfig(forceRelayMode));
  peers[clientId] = pc;
  tabletIceQueues[clientId] = [];

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      send({
        type: "ice",
        clientId,
        candidate: event.candidate
      });
    }
  };

  pc.oniceconnectionstatechange = () => {
    console.log("Tablet ICE:", pc.iceConnectionState);
  };

  pc.onconnectionstatechange = () => {
    console.log("Tablet PC:", pc.connectionState);

    if (pc.connectionState === "connected") {
      setStatus("Streaming to client: " + clientId);
    }

    if (pc.connectionState === "failed") {
      setError("WebRTC failed for client. Press Retry on phone.");
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  send({
    type: "offer",
    clientId,
    offer: pc.localDescription
  });
}

async function receiveOffer(offer) {
  if (peers.main) {
    peers.main.close();
  }

  clientIceQueue = [];

  const pc = new RTCPeerConnection(buildRtcConfig(forceRelayMode));
  peers.main = pc;

  const remoteStream = new MediaStream();
  remoteVideo.srcObject = remoteStream;

  let gotVideoFrame = false;

  pc.ontrack = async (event) => {
    remoteStream.addTrack(event.track);

    remoteVideo.autoplay = true;
    remoteVideo.playsInline = true;
    remoteVideo.controls = false;
    remoteVideo.muted = true;

    remoteViewer.style.display = "flex";

    try {
      await remoteVideo.play();
    } catch {}

    if (event.track.kind === "video") {
      event.track.onunmute = async () => {
        try {
          await remoteVideo.play();
        } catch {}
      };

      if ("requestVideoFrameCallback" in remoteVideo) {
        remoteVideo.requestVideoFrameCallback(() => {
          gotVideoFrame = true;
          setStatus("Video frame received ✅");
        });
      }
    }

    setStatus("Receiving WebRTC stream");
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      send({
        type: "ice",
        candidate: event.candidate
      });
    }
  };

  pc.oniceconnectionstatechange = () => {
    console.log("Client ICE:", pc.iceConnectionState);
  };

  pc.onconnectionstatechange = () => {
    console.log("Client PC:", pc.connectionState);

    if (pc.connectionState === "connected") {
      setStatus("WebRTC connected. Waiting for video frame...");

      setTimeout(() => {
        if (!gotVideoFrame) {
          setError("Connected but no video frame. Press Retry.");
        }
      }, 4000);
    }

    if (pc.connectionState === "failed") {
      setError("WebRTC failed. Press Retry.");
    }
  };

  await pc.setRemoteDescription(offer);

  for (const c of clientIceQueue) {
    try {
      await pc.addIceCandidate(c);
    } catch {}
  }

  clientIceQueue = [];

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  send({
    type: "answer",
    answer: pc.localDescription
  });
}

function stopTabletStream() {
  Object.keys(peers).forEach(id => {
    peers[id].close();
    delete peers[id];
  });

  peers = {};
  pendingClients.clear();
  tabletIceQueues = {};
  clientIceQueue = [];

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }

  localStream = null;

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";

  setStatus("Stream stopped");
}

startTabletBtn.onclick = startTabletScreen;
stopTabletBtn.onclick = stopTabletStream;

if (!role || !serverUrl) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
