<!DOCTYPE html>
<html>
<head>
  <title>Ultra Low Latency Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #070b0a;
      --green: #00b050;
      --green2: #19d36f;
      --green3: #00853e;
      --text: #ffffff;
      --muted: #a8b8b2;
      --danger: #ff5c5c;
      --border: rgba(255,255,255,0.1);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(0,176,80,0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,176,80,0.10), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 22px rgba(0,176,80,0.85);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 42px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }

    .status {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(0,176,80,0.10);
      border: 1px solid rgba(0,176,80,0.25);
      color: var(--green2);
      font-weight: 800;
      white-space: pre-wrap;
    }

    .error {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,92,92,0.10);
      border: 1px solid rgba(255,92,92,0.25);
      color: var(--danger);
      font-weight: 800;
      white-space: pre-wrap;
      display: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--green3));
      box-shadow: 0 12px 28px rgba(0,176,80,0.28);
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.danger {
      background: linear-gradient(135deg, #ff5c5c, #b51f1f);
    }

    input {
      width: 100%;
      padding: 15px 16px;
      margin: 8px 0 12px;
      font-size: 15px;
      color: white;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
    }

    p {
      color: var(--muted);
      margin: 0 0 8px;
    }

    .viewer {
      margin-top: 16px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      height: 72dvh;
      min-height: 300px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #remoteCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    #hiddenVideo,
    #captureCanvas {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 320px;
      height: 180px;
      opacity: 0.01;
      pointer-events: none;
    }

    .viewer:fullscreen {
      width: 100vw;
      height: 100dvh;
      margin: 0;
      border-radius: 0;
      border: 0;
      background: #000;
      display: flex !important;
    }

    .viewer:fullscreen #remoteCanvas {
      width: 100vw;
      height: 100dvh;
    }

    #qrWrap {
      margin-top: 16px;
      display: none;
    }

    #qrBox {
      display: inline-block;
      padding: 16px;
      border-radius: 22px;
      background: white;
    }

    #clientUrlBox {
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      word-break: break-all;
      display: none;
      font-size: 13px;
    }

    @media (orientation: portrait) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .viewer {
        height: 72dvh;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <div class="header">
    <div>
      <div class="brand">
        <div class="dot"></div>
        <h1>Screen Stream</h1>
      </div>
      <div class="subtitle">Ultra-low-latency binary screen stream</div>
    </div>

    <button class="secondary" onclick="fullscreenViewer()">Fullscreen</button>
  </div>

  <div class="panel">
    <div id="status" class="status">Loading...</div>
    <div id="error" class="error"></div>

    <div id="setupBox" class="panel" style="display:none;">
      <p>Paste Cloudflare tunnel URL:</p>

      <input
        id="serverInput"
        placeholder="https://xxxxx.trycloudflare.com OR wss://xxxxx.trycloudflare.com"
      >

      <div class="controls">
        <button onclick="openAsTablet()">Open as Tablet</button>
        <button class="secondary" onclick="openAsClient()">Open as Client</button>
      </div>
    </div>

    <div class="controls">
      <button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>
      <button id="stopTabletBtn" class="danger" style="display:none;">Stop Stream</button>
      <button id="fullscreenBtn" class="secondary" style="display:none;" onclick="fullscreenViewer()">Fullscreen</button>
    </div>

    <div id="qrWrap">
      <h3>Client QR</h3>
      <div id="qrBox">
        <canvas id="qr"></canvas>
      </div>
      <div id="clientUrlBox"></div>
    </div>

    <div id="remoteViewer" class="viewer">
      <canvas id="remoteCanvas"></canvas>
    </div>
  </div>
</div>

<video id="hiddenVideo" autoplay muted playsinline></video>
<canvas id="captureCanvas"></canvas>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
let serverUrl = params.get("server");

const setupBox = document.getElementById("setupBox");
const serverInput = document.getElementById("serverInput");

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startTabletBtn = document.getElementById("startTabletBtn");
const stopTabletBtn = document.getElementById("stopTabletBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");

const qrWrap = document.getElementById("qrWrap");
const qrCanvas = document.getElementById("qr");
const clientUrlBox = document.getElementById("clientUrlBox");

const remoteViewer = document.getElementById("remoteViewer");
const remoteCanvas = document.getElementById("remoteCanvas");
const remoteCtx = remoteCanvas.getContext("2d", { alpha: false });

const hiddenVideo = document.getElementById("hiddenVideo");
const captureCanvas = document.getElementById("captureCanvas");
const captureCtx = captureCanvas.getContext("2d", { alpha: false });

let ws = null;
let localStream = null;
let streaming = false;
let encoding = false;
let seq = 0;
let frameCount = 0;
let streamTimer = null;

const TYPE_VIDEO = 1;
const VIDEO_HEADER_SIZE = 22;

const TARGET_FPS = 20;
const FRAME_INTERVAL = 1000 / TARGET_FPS;
const MAX_DELAY_MS = 250;
const MIME_TYPE = "image/jpeg";

const profiles = [
  { name: "ULTRA_FAST", maxWidth: 426, quality: 0.12, bufferLimit: 45 * 1024 },
  { name: "FAST", maxWidth: 512, quality: 0.16, bufferLimit: 65 * 1024 },
  { name: "BALANCED_FAST", maxWidth: 568, quality: 0.20, bufferLimit: 85 * 1024 },
  { name: "READABLE", maxWidth: 640, quality: 0.25, bufferLimit: 110 * 1024 }
];

let profileIndex = 1;
let currentProfile = profiles[profileIndex];

let lastFrameSentAt = 0;
let lastAdaptAt = 0;

let feedbackAvgDelay = 0;
let feedbackFps = 0;

let clientDelaySamples = [];
let clientFramesThisSecond = 0;
let clientLastFeedbackAt = performance.now();

let latestPacket = null;
let renderScheduled = false;

if (role === "tablet") {
  startTabletBtn.style.display = "inline-block";
  setStatus("Tablet mode detected. Connecting...");
}

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  if (!text) {
    errorBox.style.display = "none";
    errorBox.innerText = "";
    return;
  }

  errorBox.style.display = "block";
  errorBox.innerText = text;
}

function normalizeServerUrl(url) {
  if (!url) return null;

  url = url.trim();

  if (url.startsWith("https://")) return url.replace("https://", "wss://");
  if (url.startsWith("http://")) return url.replace("http://", "ws://");
  if (url.startsWith("wss://") || url.startsWith("ws://")) return url;

  return "wss://" + url;
}

function buildUrl(newRole) {
  const cleanServer = normalizeServerUrl(serverInput.value);

  if (!cleanServer) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(cleanServer)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function sendJson(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function connectWebSocket() {
  if (!serverUrl) {
    setupBox.style.display = "block";
    setStatus("Insert tunnel URL and choose Tablet or Client");
    return;
  }

  serverUrl = normalizeServerUrl(serverUrl);

  setStatus("Connecting to tunnel:\n" + serverUrl);

  ws = new WebSocket(serverUrl);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    sendJson({
      type: "join",
      role,
      room
    });

    setStatus("Connected to tunnel");
  };

  ws.onerror = () => {
    setError("WebSocket error:\n" + serverUrl);
  };

  ws.onclose = (event) => {
    setStatus("Disconnected from tunnel\nCode: " + event.code);
  };

  ws.onmessage = (event) => {
    if (typeof event.data === "string") {
      const msg = JSON.parse(event.data);

      if (msg.type === "joined") {
        if (role === "tablet") initTablet();
        if (role === "client") initClient();
      }

      if (msg.type === "stream-start") {
        if (role === "client") {
          remoteViewer.style.display = "flex";
          setStatus("Receiving stream...");
        }
      }

      if (msg.type === "feedback") {
        if (role === "tablet") handleFeedback(msg);
      }

      if (msg.type === "stream-stop") {
        if (role === "client") {
          clearRemote();
          setStatus("Stream stopped");
        }
      }

      return;
    }

    if (role === "client") {
      receiveBinaryPacket(event.data);
    }
  };
}

function initTablet() {
  setStatus("Tablet connected. Press Start Tablet Screen.");

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";

  const clientUrl =
    window.location.origin +
    window.location.pathname +
    "?role=client" +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(serverUrl);

  qrWrap.style.display = "block";
  clientUrlBox.style.display = "block";
  clientUrlBox.innerText = clientUrl;

  if (window.QRCode) {
    QRCode.toCanvas(qrCanvas, clientUrl, function (err) {
      if (err) {
        setError("QR generation failed.\n\nClient URL:\n" + clientUrl);
      }
    });
  } else {
    setError("QR library not loaded.\n\nClient URL:\n" + clientUrl);
  }
}

function initClient() {
  setStatus("Client connected. Waiting for stream...");
  fullscreenBtn.style.display = "inline-block";
  remoteViewer.style.display = "flex";
  resizeRemoteCanvas();
}

async function startTabletScreen() {
  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: TARGET_FPS,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    hiddenVideo.srcObject = localStream;
    await hiddenVideo.play();

    await new Promise(resolve => {
      if (hiddenVideo.videoWidth > 0) {
        resolve();
        return;
      }

      hiddenVideo.onloadedmetadata = () => resolve();
    });

    streaming = true;

    sendJson({
      type: "stream-start"
    });

    startTabletBtn.style.display = "none";
    stopTabletBtn.style.display = "inline-block";

    localStream.getVideoTracks()[0].onended = () => {
      stopTabletStream();
    };

    if (streamTimer) {
      clearInterval(streamTimer);
    }

    streamTimer = setInterval(sendFixedRateFrame, FRAME_INTERVAL);

    updateTabletStatus("Started");

  } catch (err) {
    setError("Screen share failed:\n" + (err.message || err.name || err));
  }
}

function sendFixedRateFrame() {
  if (!streaming) return;

  const now = performance.now();

  if (now - lastFrameSentAt < FRAME_INTERVAL * 0.75) return;

  lastFrameSentAt = now;
  sendFrame();
}

function sendFrame() {
  if (encoding) return;
  if (!hiddenVideo.videoWidth || !hiddenVideo.videoHeight) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  if (ws.bufferedAmount > currentProfile.bufferLimit) return;

  encoding = true;

  let width = hiddenVideo.videoWidth;
  let height = hiddenVideo.videoHeight;

  if (width > currentProfile.maxWidth) {
    const scale = currentProfile.maxWidth / width;
    width = currentProfile.maxWidth;
    height = Math.round(height * scale);
  }

  captureCanvas.width = width;
  captureCanvas.height = height;
  captureCtx.drawImage(hiddenVideo, 0, 0, width, height);

  captureCanvas.toBlob(async (blob) => {
    encoding = false;

    if (!blob || !ws || ws.readyState !== WebSocket.OPEN) return;

    const imageBuffer = await blob.arrayBuffer();

    seq++;

    const packet = new ArrayBuffer(VIDEO_HEADER_SIZE + imageBuffer.byteLength);
    const view = new DataView(packet);
    const bytes = new Uint8Array(packet);

    view.setUint8(0, TYPE_VIDEO);
    view.setUint32(1, seq);
    view.setFloat64(5, Date.now());
    view.setUint16(13, width);
    view.setUint16(15, height);
    view.setUint8(17, profileIndex);
    view.setUint32(18, imageBuffer.byteLength);

    bytes.set(new Uint8Array(imageBuffer), VIDEO_HEADER_SIZE);

    ws.send(packet);
  }, MIME_TYPE, currentProfile.quality);
}

function receiveBinaryPacket(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  const packetType = view.getUint8(0);

  if (packetType === TYPE_VIDEO) {
    receiveVideoFrame(arrayBuffer);
  }
}

function receiveVideoFrame(arrayBuffer) {
  const view = new DataView(arrayBuffer);

  const sentAt = view.getFloat64(5);
  const payloadSize = view.getUint32(18);

  const delay = Date.now() - sentAt;

  if (delay > MAX_DELAY_MS) {
    sendFeedbackIfNeeded(delay);
    return;
  }

  clientDelaySamples.push(delay);

  if (clientDelaySamples.length > 20) {
    clientDelaySamples.shift();
  }

  const payload = arrayBuffer.slice(VIDEO_HEADER_SIZE, VIDEO_HEADER_SIZE + payloadSize);

  latestPacket = {
    payload
  };

  clientFramesThisSecond++;

  if (!renderScheduled) {
    renderScheduled = true;
    requestAnimationFrame(renderLatestPacket);
  }

  sendFeedbackIfNeeded(delay);
}

async function renderLatestPacket() {
  renderScheduled = false;

  if (!latestPacket) return;

  const packet = latestPacket;
  latestPacket = null;

  try {
    const blob = new Blob([packet.payload], { type: MIME_TYPE });
    const bitmap = await createImageBitmap(blob);

    resizeRemoteCanvas();
    renderBitmapContain(bitmap);

    bitmap.close();

    frameCount++;

    if (frameCount === 1) {
      setStatus("Screen received");
    }
  } catch {}
}

function sendFeedbackIfNeeded(lastDelay) {
  const now = performance.now();

  if (now - clientLastFeedbackAt < 700) return;

  const avgDelay =
    clientDelaySamples.reduce((sum, value) => sum + value, 0) /
    Math.max(1, clientDelaySamples.length);

  sendJson({
    type: "feedback",
    avgDelay: Math.round(avgDelay || lastDelay || 0),
    lastDelay: Math.round(lastDelay || 0),
    receivedFps: clientFramesThisSecond
  });

  clientFramesThisSecond = 0;
  clientLastFeedbackAt = now;
}

function handleFeedback(msg) {
  feedbackAvgDelay = msg.avgDelay;
  feedbackFps = msg.receivedFps;

  const now = performance.now();

  if (now - lastAdaptAt < 700) return;

  lastAdaptAt = now;

  if (msg.avgDelay > 250 || msg.receivedFps < 16) {
    profileIndex = Math.max(0, profileIndex - 1);
    currentProfile = profiles[profileIndex];
    updateTabletStatus("Low latency downgrade");
    return;
  }

  if (msg.avgDelay < 120 && msg.receivedFps >= 18) {
    profileIndex = Math.min(profiles.length - 1, profileIndex + 1);
    currentProfile = profiles[profileIndex];
    updateTabletStatus("Stable upgrade");
    return;
  }

  updateTabletStatus("Stable low latency");
}

function updateTabletStatus(reason) {
  setStatus(
    "Streaming lowest latency\n" +
    "FPS: " + TARGET_FPS + "\n" +
    "Profile: " + currentProfile.name + "\n" +
    "Width: " + currentProfile.maxWidth + "\n" +
    "Quality: " + currentProfile.quality + "\n" +
    "Phone FPS: " + feedbackFps + "\n" +
    "Delay: " + feedbackAvgDelay + " ms\n" +
    reason
  );
}

function resizeRemoteCanvas() {
  const rect = remoteViewer.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  const width = Math.max(1, Math.floor(rect.width * dpr));
  const height = Math.max(1, Math.floor(rect.height * dpr));

  if (remoteCanvas.width !== width || remoteCanvas.height !== height) {
    remoteCanvas.width = width;
    remoteCanvas.height = height;
  }
}

function renderBitmapContain(bitmap) {
  const canvasW = remoteCanvas.width;
  const canvasH = remoteCanvas.height;

  const imgW = bitmap.width;
  const imgH = bitmap.height;

  const scale = Math.min(canvasW / imgW, canvasH / imgH);

  const drawW = imgW * scale;
  const drawH = imgH * scale;

  const x = (canvasW - drawW) / 2;
  const y = (canvasH - drawH) / 2;

  remoteCtx.fillStyle = "#000";
  remoteCtx.fillRect(0, 0, canvasW, canvasH);
  remoteCtx.drawImage(bitmap, x, y, drawW, drawH);
}

function clearRemote() {
  remoteCtx.clearRect(0, 0, remoteCanvas.width, remoteCanvas.height);
  remoteViewer.style.display = "none";
  frameCount = 0;
}

function stopTabletStream() {
  streaming = false;

  if (streamTimer) {
    clearInterval(streamTimer);
    streamTimer = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }

  localStream = null;
  hiddenVideo.srcObject = null;

  sendJson({
    type: "stream-stop"
  });

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";

  setStatus("Stream stopped");
}

async function fullscreenViewer() {
  remoteViewer.style.display = "flex";
  resizeRemoteCanvas();

  try {
    await remoteViewer.requestFullscreen();
  } catch {}
}

window.addEventListener("resize", resizeRemoteCanvas);

document.addEventListener("fullscreenchange", () => {
  setTimeout(resizeRemoteCanvas, 150);
});

startTabletBtn.onclick = startTabletScreen;
stopTabletBtn.onclick = stopTabletStream;

if (!role || !serverUrl) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
``
