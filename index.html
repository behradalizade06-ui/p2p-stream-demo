<!DOCTYPE html>
<html>
<head>
  <title>Tunnel Tablet Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 16px;
      margin: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    input {
      width: 95%;
      max-width: 700px;
      padding: 10px;
      margin: 6px 0;
      font-size: 14px;
    }

    video, img {
      width: 100%;
      max-width: 900px;
      background: black;
      margin-top: 15px;
      border: 1px solid #ccc;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #0a5;
      white-space: pre-wrap;
    }

    #error {
      margin-top: 15px;
      font-weight: bold;
      color: red;
      white-space: pre-wrap;
    }

    .box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
    }

    #qr {
      margin-top: 15px;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<h2>Tunnel Tablet Screen Stream</h2>

<div id="status">Loading...</div>
<div id="error"></div>

<div id="setupBox" class="box" style="display:none;">
  <h3>Setup</h3>

  <p>Paste Cloudflare tunnel URL:</p>

  <input
    id="serverInput"
    placeholder="https://xxxxx.trycloudflare.com OR wss://xxxxx.trycloudflare.com"
  >

  <br>

  <button onclick="openAsTablet()">Open as Tablet</button>
  <button onclick="openAsClient()">Open as Client</button>
</div>

<button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>
<button id="stopTabletBtn" style="display:none;">Stop Stream</button>

<h3 id="qrTitle" style="display:none;">Client QR</h3>
<canvas id="qr" style="display:none;"></canvas>

<video id="localVideo" autoplay muted playsinline style="display:none;"></video>

<img id="remoteImage" style="display:none;" alt="Remote tablet screen">

<canvas id="captureCanvas"></canvas>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
let serverUrl = params.get("server");

const setupBox = document.getElementById("setupBox");
const serverInput = document.getElementById("serverInput");

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startTabletBtn = document.getElementById("startTabletBtn");
const stopTabletBtn = document.getElementById("stopTabletBtn");

const qrTitle = document.getElementById("qrTitle");
const qrCanvas = document.getElementById("qr");

const localVideo = document.getElementById("localVideo");
const remoteImage = document.getElementById("remoteImage");
const captureCanvas = document.getElementById("captureCanvas");
const captureCtx = captureCanvas.getContext("2d");

let ws = null;
let localStream = null;
let frameTimer = null;
let lastImageUrl = null;

const FPS = 8;
const JPEG_QUALITY = 0.65;
const MAX_WIDTH = 1280;

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  errorBox.innerText = text;
}

function clearError() {
  errorBox.innerText = "";
}

function normalizeServerUrl(url) {
  if (!url) return null;

  url = url.trim();

  if (url.startsWith("https://")) {
    return url.replace("https://", "wss://");
  }

  if (url.startsWith("http://")) {
    return url.replace("http://", "ws://");
  }

  if (url.startsWith("wss://") || url.startsWith("ws://")) {
    return url;
  }

  return "wss://" + url;
}

function buildUrl(newRole) {
  const cleanServer = normalizeServerUrl(serverInput.value);

  if (!cleanServer) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(cleanServer)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function sendJson(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function connectWebSocket() {
  if (!serverUrl) {
    setupBox.style.display = "block";
    setStatus("Insert tunnel URL and choose Tablet or Client");
    return;
  }

  serverUrl = normalizeServerUrl(serverUrl);

  setStatus("Connecting to tunnel:\n" + serverUrl);

  ws = new WebSocket(serverUrl);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    clearError();

    sendJson({
      type: "join",
      role: role,
      room: room
    });

    setStatus("Connected to Cloudflare tunnel server");
  };

  ws.onerror = () => {
    setError("WebSocket error. Check tunnel and server.");
  };

  ws.onclose = () => {
    setStatus("Disconnected from tunnel server");
  };

  ws.onmessage = (event) => {
    if (typeof event.data === "string") {
      const msg = JSON.parse(event.data);

      if (msg.type === "joined") {
        if (role === "tablet") {
          initTabletUi();
        }

        if (role === "client") {
          setStatus("Client connected. Waiting for frames...");
        }
      }

      if (msg.type === "stream-start") {
        if (role === "client") {
          remoteImage.style.display = "block";
          setStatus("Receiving tablet screen through Cloudflare tunnel...");
        }
      }

      if (msg.type === "stream-stop") {
        if (role === "client") {
          stopClientViewer();
        }
      }

      return;
    }

    if (role === "client") {
      showFrame(event.data);
    }
  };
}

function initTabletUi() {
  setStatus("Tablet connected. Press Start Tablet Screen.");

  startTabletBtn.style.display = "inline-block";

  const clientUrl =
    window.location.origin +
    window.location.pathname +
    "?role=client" +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(serverUrl);

  qrTitle.style.display = "block";
  qrCanvas.style.display = "block";

  QRCode.toCanvas(qrCanvas, clientUrl);
}

async function startTabletScreen() {
  clearError();

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      setError("Screen sharing not supported on this device/browser.");
      return;
    }

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: FPS,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    localVideo.srcObject = localStream;
    localVideo.style.display = "block";

    await localVideo.play();

    sendJson({
      type: "stream-start",
      mimeType: "image/jpeg"
    });

    startTabletBtn.style.display = "none";
    stopTabletBtn.style.display = "inline-block";

    localStream.getVideoTracks()[0].onended = () => {
      stopTabletStream();
    };

    frameTimer = setInterval(sendFrame, 1000 / FPS);

    setStatus("Streaming tablet screen THROUGH CLOUDFLARE TUNNEL");

  } catch (err) {
    console.error(err);
    setError("Screen share failed:\n" + (err.message || err.name || err));
  }
}

function sendFrame() {
  if (!localVideo.videoWidth || !localVideo.videoHeight) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  let width = localVideo.videoWidth;
  let height = localVideo.videoHeight;

  if (width > MAX_WIDTH) {
    const scale = MAX_WIDTH / width;
    width = MAX_WIDTH;
    height = Math.round(height * scale);
  }

  captureCanvas.width = width;
  captureCanvas.height = height;

  captureCtx.drawImage(localVideo, 0, 0, width, height);

  captureCanvas.toBlob(async (blob) => {
    if (!blob || !ws || ws.readyState !== WebSocket.OPEN) return;

    const buffer = await blob.arrayBuffer();
    ws.send(buffer);
  }, "image/jpeg", JPEG_QUALITY);
}

function stopTabletStream() {
  if (frameTimer) {
    clearInterval(frameTimer);
    frameTimer = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }

  localStream = null;

  sendJson({
    type: "stream-stop"
  });

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";

  setStatus("Stream stopped");
}

function showFrame(arrayBuffer) {
  const blob = new Blob([arrayBuffer], { type: "image/jpeg" });
  const url = URL.createObjectURL(blob);

  remoteImage.onload = () => {
    if (lastImageUrl) {
      URL.revokeObjectURL(lastImageUrl);
    }

    lastImageUrl = url;
  };

  remoteImage.src = url;
  remoteImage.style.display = "block";
}

function stopClientViewer() {
  if (lastImageUrl) {
    URL.revokeObjectURL(lastImageUrl);
    lastImageUrl = null;
  }

  remoteImage.removeAttribute("src");
  remoteImage.style.display = "none";

  setStatus("Stream stopped");
}

startTabletBtn.onclick = startTabletScreen;
stopTabletBtn.onclick = stopTabletStream;

if (!role || !serverUrl) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
