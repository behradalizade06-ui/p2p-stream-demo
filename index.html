<!DOCTYPE html>
<html>
<head>
  <title>Tunnel Tablet Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 16px;
      margin: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    input {
      width: 95%;
      max-width: 700px;
      padding: 10px;
      margin: 6px 0;
      font-size: 14px;
    }

    video {
      width: 100%;
      max-width: 900px;
      background: black;
      margin-top: 15px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #0a5;
      white-space: pre-wrap;
    }

    #error {
      margin-top: 15px;
      font-weight: bold;
      color: red;
      white-space: pre-wrap;
    }

    .box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
    }

    #qr {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h2>Tunnel Tablet Screen Stream</h2>

<div id="status">Loading...</div>
<div id="error"></div>

<div id="setupBox" class="box" style="display:none;">
  <h3>Setup</h3>

  <p>Paste Cloudflare tunnel URL:</p>

  <input
    id="serverInput"
    placeholder="https://xxxxx.trycloudflare.com OR wss://xxxxx.trycloudflare.com"
  >

  <br>

  <button onclick="openAsTablet()">Open as Tablet</button>
  <button onclick="openAsClient()">Open as Client</button>
</div>

<button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>
<button id="stopTabletBtn" style="display:none;">Stop Stream</button>

<h3 id="qrTitle" style="display:none;">Client QR</h3>
<canvas id="qr" style="display:none;"></canvas>

<video id="localVideo" autoplay muted playsinline style="display:none;"></video>
<video id="remoteVideo" autoplay playsinline controls style="display:none;"></video>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
let serverUrl = params.get("server");

const setupBox = document.getElementById("setupBox");
const serverInput = document.getElementById("serverInput");

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startTabletBtn = document.getElementById("startTabletBtn");
const stopTabletBtn = document.getElementById("stopTabletBtn");

const qrTitle = document.getElementById("qrTitle");
const qrCanvas = document.getElementById("qr");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

let ws = null;
let localStream = null;
let recorder = null;

let mediaSource = null;
let sourceBuffer = null;
let queue = [];
let mediaReady = false;

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  errorBox.innerText = text;
}

function clearError() {
  errorBox.innerText = "";
}

function normalizeServerUrl(url) {
  if (!url) return null;

  url = url.trim();

  if (url.startsWith("https://")) {
    return url.replace("https://", "wss://");
  }

  if (url.startsWith("http://")) {
    return url.replace("http://", "ws://");
  }

  if (url.startsWith("wss://") || url.startsWith("ws://")) {
    return url;
  }

  return "wss://" + url;
}

function buildUrl(newRole) {
  const cleanServer = normalizeServerUrl(serverInput.value);

  if (!cleanServer) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(cleanServer)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function sendJson(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function connectWebSocket() {
  if (!serverUrl) {
    setupBox.style.display = "block";
    setStatus("Insert tunnel URL and choose Tablet or Client");
    return;
  }

  serverUrl = normalizeServerUrl(serverUrl);

  setStatus("Connecting to tunnel:\n" + serverUrl);

  ws = new WebSocket(serverUrl);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    clearError();

    sendJson({
      type: "join",
      role: role,
      room: room
    });

    setStatus("Connected to Cloudflare tunnel server");
  };

  ws.onerror = () => {
    setError("WebSocket error. Check tunnel and server.");
  };

  ws.onclose = () => {
    setStatus("Disconnected from tunnel server");
  };

  ws.onmessage = async (event) => {
    if (typeof event.data === "string") {
      const msg = JSON.parse(event.data);

      if (msg.type === "joined") {
        if (role === "tablet") {
          initTabletUi();
        }

        if (role === "client") {
          setStatus("Client connected. Waiting for stream...");
        }
      }

      if (msg.type === "stream-start") {
        if (role === "client") {
          startClientPlayer(msg.mimeType);
        }
      }

      if (msg.type === "stream-stop") {
        if (role === "client") {
          stopClientPlayer();
        }
      }

      return;
    }

    if (role === "client") {
      appendVideoChunk(event.data);
    }
  };
}

function initTabletUi() {
  setStatus("Tablet connected. Press Start Tablet Screen.");

  startTabletBtn.style.display = "inline-block";

  const clientUrl =
    window.location.origin +
    window.location.pathname +
    "?role=client" +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(serverUrl);

  qrTitle.style.display = "block";
  qrCanvas.style.display = "block";

  QRCode.toCanvas(qrCanvas, clientUrl);
}

async function startTabletScreen() {
  clearError();

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      setError("Screen sharing not supported on this device/browser.");
      return;
    }

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: 20,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    localVideo.srcObject = localStream;
    localVideo.style.display = "block";

    const mimeTypes = [
      "video/webm;codecs=vp8",
      "video/webm;codecs=vp9",
      "video/webm"
    ];

    let mimeType = "";

    for (const type of mimeTypes) {
      if (MediaRecorder.isTypeSupported(type)) {
        mimeType = type;
        break;
      }
    }

    if (!mimeType) {
      setError("No supported MediaRecorder codec found.");
      return;
    }

    sendJson({
      type: "stream-start",
      mimeType: mimeType
    });

    recorder = new MediaRecorder(localStream, {
      mimeType: mimeType,
      videoBitsPerSecond: 1200000
    });

    recorder.ondataavailable = async (event) => {
      if (event.data && event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
        const buffer = await event.data.arrayBuffer();
        ws.send(buffer);
      }
    };

    recorder.onstop = () => {
      sendJson({
        type: "stream-stop"
      });
    };

    localStream.getVideoTracks()[0].onended = () => {
      stopTabletStream();
    };

    recorder.start(250);

    startTabletBtn.style.display = "none";
    stopTabletBtn.style.display = "inline-block";

    setStatus("Streaming tablet screen THROUGH CLOUDFLARE TUNNEL");

  } catch (err) {
    console.error(err);
    setError("Screen share failed:\n" + (err.message || err.name || err));
  }
}

function stopTabletStream() {
  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }

  recorder = null;
  localStream = null;

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";

  setStatus("Stream stopped");
}

function startClientPlayer(mimeType) {
  clearError();

  queue = [];
  sourceBuffer = null;
  mediaReady = false;

  if (!window.MediaSource) {
    setError("MediaSource not supported on this browser.");
    return;
  }

  if (!MediaSource.isTypeSupported(mimeType)) {
    setError("Client browser does not support codec:\n" + mimeType);
    return;
  }

  mediaSource = new MediaSource();

  remoteVideo.src = URL.createObjectURL(mediaSource);
  remoteVideo.style.display = "block";

  mediaSource.addEventListener("sourceopen", () => {
    sourceBuffer = mediaSource.addSourceBuffer(mimeType);
    sourceBuffer.mode = "sequence";

    sourceBuffer.addEventListener("updateend", processQueue);

    mediaReady = true;
    processQueue();

    remoteVideo.play().catch(() => {});
  });

  setStatus("Receiving stream through Cloudflare tunnel...");
}

function appendVideoChunk(chunk) {
  if (!mediaReady || !sourceBuffer) {
    queue.push(chunk);
    return;
  }

  queue.push(chunk);
  processQueue();
}

function processQueue() {
  if (!sourceBuffer || sourceBuffer.updating || queue.length === 0) {
    return;
  }

  const chunk = queue.shift();

  try {
    sourceBuffer.appendBuffer(chunk);
  } catch (err) {
    console.error(err);
    setError("Video buffer error:\n" + (err.message || err.name || err));
  }
}

function stopClientPlayer() {
  queue = [];
  mediaReady = false;

  if (remoteVideo.src) {
    URL.revokeObjectURL(remoteVideo.src);
  }

  remoteVideo.removeAttribute("src");
  remoteVideo.load();

  setStatus("Stream stopped");
}

startTabletBtn.onclick = startTabletScreen;
stopTabletBtn.onclick = stopTabletStream;

if (!role || !serverUrl) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
