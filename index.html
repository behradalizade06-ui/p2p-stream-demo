<!DOCTYPE html>
<html>
<head>
  <title>Tunnel Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #070b0a;
      --green: #00b050;
      --green2: #19d36f;
      --green3: #00853e;
      --text: #ffffff;
      --muted: #a8b8b2;
      --danger: #ff5c5c;
      --border: rgba(255,255,255,0.1);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(0,176,80,0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,176,80,0.10), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 22px rgba(0,176,80,0.85);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 42px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }

    .status {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(0,176,80,0.10);
      border: 1px solid rgba(0,176,80,0.25);
      color: var(--green2);
      font-weight: 800;
      white-space: pre-wrap;
    }

    .error {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,92,92,0.10);
      border: 1px solid rgba(255,92,92,0.25);
      color: var(--danger);
      font-weight: 800;
      white-space: pre-wrap;
      display: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--green3));
      box-shadow: 0 12px 28px rgba(0,176,80,0.28);
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.danger {
      background: linear-gradient(135deg, #ff5c5c, #b51f1f);
    }

    input {
      width: 100%;
      padding: 15px 16px;
      margin: 8px 0 12px;
      font-size: 15px;
      color: white;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
    }

    p {
      color: var(--muted);
      margin: 0 0 8px;
    }

    .viewer {
      margin-top: 16px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      height: 70dvh;
      min-height: 300px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #remoteCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    #hiddenVideo,
    #captureCanvas {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 320px;
      height: 180px;
      opacity: 0.01;
      pointer-events: none;
    }

    .viewer:fullscreen {
      width: 100vw;
      height: 100dvh;
      margin: 0;
      border-radius: 0;
      border: 0;
      background: #000;
      display: flex !important;
    }

    .viewer:fullscreen #remoteCanvas {
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
    }

    #qrWrap {
      margin-top: 16px;
      display: none;
    }

    #qrBox {
      display: inline-block;
      padding: 16px;
      border-radius: 22px;
      background: white;
    }

    #tabletOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #000;
      color: white;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    #tabletOverlay h2 {
      color: var(--green2);
      font-size: 32px;
      margin: 0 0 12px;
    }

    #tabletOverlay p {
      color: white;
      font-size: 18px;
      line-height: 1.4;
    }

    @media (orientation: portrait) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <div class="header">
    <div>
      <div class="brand">
        <div class="dot"></div>
        <h1>Screen Stream</h1>
      </div>
      <div class="subtitle">Stable screen stream through Cloudflare tunnel</div>
    </div>

    <button class="secondary" onclick="fullscreenViewer()">Fullscreen</button>
  </div>

  <div class="panel">
    <div id="status" class="status">Loading...</div>
    <div id="error" class="error"></div>

    <div id="setupBox" class="panel" style="display:none;">
      <p>Paste Cloudflare tunnel URL:</p>

      <input
        id="serverInput"
        placeholder="https://xxxxx.trycloudflare.com OR wss://xxxxx.trycloudflare.com"
      >

      <div class="controls">
        <button onclick="openAsTablet()">Open as Tablet</button>
        <button class="secondary" onclick="openAsClient()">Open as Client</button>
      </div>
    </div>

    <div class="controls">
      <button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>
      <button id="stopTabletBtn" class="danger" style="display:none;">Stop Stream</button>
      <button id="fullscreenBtn" class="secondary" style="display:none;" onclick="fullscreenViewer()">Fullscreen</button>
    </div>

    <div id="qrWrap">
      <h3>Client QR</h3>
      <div id="qrBox">
        <canvas id="qr"></canvas>
      </div>
    </div>

    <div id="remoteViewer" class="viewer">
      <canvas id="remoteCanvas"></canvas>
    </div>
  </div>
</div>

<div id="tabletOverlay">
  <div>
    <h2>Streaming Active</h2>
    <p>Now switch to the real tablet content.</p>
    <p>Do not stay on this page.</p>
  </div>
</div>

<video id="hiddenVideo" autoplay muted playsinline></video>
<canvas id="captureCanvas"></canvas>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
let serverUrl = params.get("server");

const setupBox = document.getElementById("setupBox");
const serverInput = document.getElementById("serverInput");

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startTabletBtn = document.getElementById("startTabletBtn");
const stopTabletBtn = document.getElementById("stopTabletBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");

const qrWrap = document.getElementById("qrWrap");
const qrCanvas = document.getElementById("qr");

const remoteViewer = document.getElementById("remoteViewer");
const remoteCanvas = document.getElementById("remoteCanvas");
const remoteCtx = remoteCanvas.getContext("2d");

const hiddenVideo = document.getElementById("hiddenVideo");
const captureCanvas = document.getElementById("captureCanvas");
const captureCtx = captureCanvas.getContext("2d");

const tabletOverlay = document.getElementById("tabletOverlay");

let ws = null;
let localStream = null;
let streaming = false;
let encoding = false;
let drawing = false;
let pendingBitmap = null;
let frameCount = 0;

const FPS = 15;
const QUALITY = 0.68;
const MAX_WIDTH = 960;
const MIME_TYPE = "image/webp";

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  if (!text) {
    errorBox.style.display = "none";
    errorBox.innerText = "";
    return;
  }

  errorBox.style.display = "block";
  errorBox.innerText = text;
}

function normalizeServerUrl(url) {
  if (!url) return null;

  url = url.trim();

  if (url.startsWith("https://")) return url.replace("https://", "wss://");
  if (url.startsWith("http://")) return url.replace("http://", "ws://");
  if (url.startsWith("wss://") || url.startsWith("ws://")) return url;

  return "wss://" + url;
}

function buildUrl(newRole) {
  const cleanServer = normalizeServerUrl(serverInput.value);

  if (!cleanServer) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(cleanServer)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function sendJson(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function connectWebSocket() {
  if (!serverUrl) {
    setupBox.style.display = "block";
    setStatus("Insert tunnel URL and choose Tablet or Client");
    return;
  }

  serverUrl = normalizeServerUrl(serverUrl);

  setStatus("Connecting to tunnel:\n" + serverUrl);

  ws = new WebSocket(serverUrl);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    sendJson({
      type: "join",
      role,
      room
    });

    setStatus("Connected to tunnel");
  };

  ws.onerror = () => {
    setError("WebSocket error:\n" + serverUrl);
  };

  ws.onclose = (event) => {
    setStatus("Disconnected from tunnel\nCode: " + event.code);
  };

  ws.onmessage = async (event) => {
    if (typeof event.data === "string") {
      const msg = JSON.parse(event.data);

      if (msg.type === "joined") {
        if (role === "tablet") initTablet();
        if (role === "client") initClient();
      }

      if (msg.type === "stream-start") {
        if (role === "client") {
          remoteViewer.style.display = "flex";
          setStatus("Receiving screen frames...");
        }
      }

      if (msg.type === "stream-stop") {
        if (role === "client") {
          clearRemote();
          setStatus("Stream stopped");
        }
      }

      return;
    }

    if (role === "client") {
      drawFrame(event.data);
    }
  };
}

function initTablet() {
  setStatus("Tablet connected. Press Start Tablet Screen.");
  startTabletBtn.style.display = "inline-block";

  const clientUrl =
    window.location.origin +
    window.location.pathname +
    "?role=client" +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(serverUrl);

  qrWrap.style.display = "block";
  QRCode.toCanvas(qrCanvas, clientUrl);
}

function initClient() {
  setStatus("Client connected. Waiting for stream...");
  fullscreenBtn.style.display = "inline-block";
}

async function startTabletScreen() {
  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: FPS,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    hiddenVideo.srcObject = localStream;
    await hiddenVideo.play();

    streaming = true;

    sendJson({
      type: "stream-start",
      mimeType: MIME_TYPE
    });

    startTabletBtn.style.display = "none";
    stopTabletBtn.style.display = "inline-block";
    tabletOverlay.style.display = "flex";

    localStream.getVideoTracks()[0].onended = () => {
      stopTabletStream();
    };

    frameLoop();

    setStatus("Streaming screen frames through tunnel");

  } catch (err) {
    setError("Screen share failed:\n" + (err.message || err.name || err));
  }
}

function frameLoop() {
  if (!streaming) return;

  sendFrame();

  setTimeout(frameLoop, 1000 / FPS);
}

function sendFrame() {
  if (encoding) return;
  if (!hiddenVideo.videoWidth || !hiddenVideo.videoHeight) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (ws.bufferedAmount > 3 * 1024 * 1024) return;

  encoding = true;

  let width = hiddenVideo.videoWidth;
  let height = hiddenVideo.videoHeight;

  if (width > MAX_WIDTH) {
    const scale = MAX_WIDTH / width;
    width = MAX_WIDTH;
    height = Math.round(height * scale);
  }

  captureCanvas.width = width;
  captureCanvas.height = height;

  captureCtx.drawImage(hiddenVideo, 0, 0, width, height);

  captureCanvas.toBlob(async (blob) => {
    encoding = false;

    if (!blob || !ws || ws.readyState !== WebSocket.OPEN) return;

    const buffer = await blob.arrayBuffer();
    ws.send(buffer);
  }, MIME_TYPE, QUALITY);
}

async function drawFrame(arrayBuffer) {
  const blob = new Blob([arrayBuffer], { type: MIME_TYPE });

  try {
    const bitmap = await createImageBitmap(blob);

    if (drawing) {
      if (pendingBitmap) pendingBitmap.close();
      pendingBitmap = bitmap;
      return;
    }

    drawing = true;
    renderBitmap(bitmap);
    drawing = false;

    if (pendingBitmap) {
      const next = pendingBitmap;
      pendingBitmap = null;
      renderBitmap(next);
    }

  } catch (err) {
    setError("Frame decode error:\n" + (err.message || err.name || err));
  }
}

function renderBitmap(bitmap) {
  if (remoteCanvas.width !== bitmap.width || remoteCanvas.height !== bitmap.height) {
    remoteCanvas.width = bitmap.width;
    remoteCanvas.height = bitmap.height;
  }

  remoteCtx.drawImage(bitmap, 0, 0, remoteCanvas.width, remoteCanvas.height);
  bitmap.close();

  frameCount++;

  if (frameCount === 1) {
    remoteViewer.style.display = "flex";
    setStatus("Screen received ✅");
  }
}

function clearRemote() {
  remoteCtx.clearRect(0, 0, remoteCanvas.width, remoteCanvas.height);
  remoteViewer.style.display = "none";
  frameCount = 0;
}

function stopTabletStream() {
  streaming = false;

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }

  localStream = null;
  hiddenVideo.srcObject = null;

  sendJson({
    type: "stream-stop"
  });

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";
  tabletOverlay.style.display = "none";

  setStatus("Stream stopped");
}

async function fullscreenViewer() {
  remoteViewer.style.display = "flex";

  try {
    await remoteViewer.requestFullscreen();
  } catch {}
}

startTabletBtn.onclick = startTabletScreen;
stopTabletBtn.onclick = stopTabletStream;

if (!role || !serverUrl) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
