<!DOCTYPE html>
<html>
<head>
  <title>Tablet Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 16px;
      margin: 6px;
      font-size: 16px;
    }

    video {
      width: 100%;
      max-width: 900px;
      background: black;
      margin-top: 15px;
    }

    #qr {
      margin-top: 15px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Tablet Screen Stream</h2>

<div id="status">Loading...</div>

<button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>

<h3 id="qrTitle" style="display:none;">Client QR</h3>
<canvas id="qr" style="display:none;"></canvas>

<video id="localVideo" autoplay muted playsinline style="display:none;"></video>
<video id="remoteVideo" autoplay playsinline controls style="display:none;"></video>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
const serverUrl = params.get("server");

const statusBox = document.getElementById("status");
const startTabletBtn = document.getElementById("startTabletBtn");
const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const qrCanvas = document.getElementById("qr");
const qrTitle = document.getElementById("qrTitle");

let ws;
let localStream = null;
let peers = {};

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

function setStatus(text) {
  statusBox.innerText = text;
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function connectWebSocket() {
  if (!serverUrl) {
    setStatus("Missing server URL");
    return;
  }

  ws = new WebSocket(serverUrl);

  ws.onopen = () => {
    send({
      type: "join",
      role,
      room
    });

    setStatus("Connected to PC server");
  };

  ws.onerror = () => {
    setStatus("WebSocket error");
  };

  ws.onclose = () => {
    setStatus("Disconnected from PC server");
  };

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "joined") {
      if (role === "tablet") {
        setStatus("Tablet connected. Start screen share.");

        startTabletBtn.style.display = "inline-block";

        const clientUrl =
          window.location.origin +
          window.location.pathname +
          "?role=client&room=" +
          encodeURIComponent(room) +
          "&server=" +
          encodeURIComponent(serverUrl);

        qrTitle.style.display = "block";
        qrCanvas.style.display = "block";

        QRCode.toCanvas(qrCanvas, clientUrl);
      }

      if (role === "client") {
        setStatus("Client connected. Waiting for tablet stream...");
      }
    }

    if (msg.type === "client-joined") {
      if (role === "tablet") {
        await createOfferForClient(msg.clientId);
      }
    }

    if (msg.type === "offer") {
      if (role === "client") {
        await receiveOffer(msg.offer);
      }
    }

    if (msg.type === "answer") {
      if (role === "tablet") {
        const pc = peers[msg.clientId];
        if (pc) {
          await pc.setRemoteDescription(msg.answer);
        }
      }
    }

    if (msg.type === "ice") {
      if (role === "tablet") {
        const pc = peers[msg.clientId];
        if (pc && msg.candidate) {
          await pc.addIceCandidate(msg.candidate);
        }
      }

      if (role === "client") {
        const pc = peers.main;
        if (pc && msg.candidate) {
          await pc.addIceCandidate(msg.candidate);
        }
      }
    }

    if (msg.type === "client-left") {
      if (role === "tablet") {
        const pc = peers[msg.clientId];

        if (pc) {
          pc.close();
          delete peers[msg.clientId];
        }
      }
    }
  };
}

async function startTabletScreen() {
  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: false
    });

    localVideo.srcObject = localStream;
    localVideo.style.display = "block";

    setStatus("Tablet screen sharing active");

  } catch (err) {
    console.error(err);
    setStatus("Screen share failed");
  }
}

async function createOfferForClient(clientId) {
  if (!localStream) {
    setStatus("Client joined, but tablet screen is not started yet");
    return;
  }

  const pc = new RTCPeerConnection(rtcConfig);
  peers[clientId] = pc;

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      send({
        type: "ice",
        clientId,
        candidate: event.candidate
      });
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  send({
    type: "offer",
    clientId,
    offer
  });

  setStatus("Sending tablet screen to client: " + clientId);
}

async function receiveOffer(offer) {
  const pc = new RTCPeerConnection(rtcConfig);
  peers.main = pc;

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
    remoteVideo.style.display = "block";
    setStatus("Receiving tablet screen");
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      send({
        type: "ice",
        candidate: event.candidate
      });
    }
  };

  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  send({
    type: "answer",
    answer
  });
}

startTabletBtn.onclick = startTabletScreen;

if (!role || !serverUrl) {
  setStatus("Open with role and server parameters");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
