<!DOCTYPE html>
<html>
<head>
  <title>Tablet Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 16px;
      margin: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    video {
      width: 100%;
      max-width: 900px;
      background: black;
      margin-top: 15px;
    }

    #qr {
      margin-top: 15px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #0a5;
    }

    #error {
      margin-top: 15px;
      font-weight: bold;
      color: red;
      white-space: pre-wrap;
    }

    input {
      width: 95%;
      max-width: 700px;
      padding: 10px;
      margin: 6px 0;
      font-size: 14px;
    }

    .box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h2>Tablet Screen Stream</h2>

<div id="status">Loading...</div>
<div id="error"></div>

<div id="setupBox" class="box" style="display:none;">
  <h3>Setup</h3>

  <p>Paste your Cloudflare tunnel URL:</p>

  <input
    id="serverInput"
    placeholder="https://xxxxx.trycloudflare.com OR wss://xxxxx.trycloudflare.com"
  >

  <br>

  <button onclick="openAsTablet()">Open as Tablet</button>
  <button onclick="openAsClient()">Open as Client</button>
</div>

<button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>

<h3 id="qrTitle" style="display:none;">Client QR</h3>
<canvas id="qr" style="display:none;"></canvas>

<video id="localVideo" autoplay muted playsinline style="display:none;"></video>
<video id="remoteVideo" autoplay playsinline controls style="display:none;"></video>

<script>
const params = new URLSearchParams(window.location.search);

let role = params.get("role");
let room = params.get("room") || "demo";
let serverUrl = params.get("server");

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");
const setupBox = document.getElementById("setupBox");
const serverInput = document.getElementById("serverInput");
const startTabletBtn = document.getElementById("startTabletBtn");
const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const qrCanvas = document.getElementById("qr");
const qrTitle = document.getElementById("qrTitle");

let ws;
let localStream = null;
let peers = {};
let waitingClients = new Set();

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  errorBox.innerText = text;
}

function clearError() {
  errorBox.innerText = "";
}

function normalizeServerUrl(url) {
  if (!url) return null;

  url = url.trim();

  if (url.startsWith("https://")) {
    return url.replace("https://", "wss://");
  }

  if (url.startsWith("http://")) {
    return url.replace("http://", "ws://");
  }

  if (url.startsWith("wss://") || url.startsWith("ws://")) {
    return url;
  }

  return "wss://" + url;
}

function buildUrl(newRole) {
  const cleanServer = normalizeServerUrl(serverInput.value);

  if (!cleanServer) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(cleanServer)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function connectWebSocket() {
  if (!serverUrl) {
    setupBox.style.display = "block";
    setStatus("Insert tunnel URL and choose Tablet or Client");
    return;
  }

  serverUrl = normalizeServerUrl(serverUrl);

  setStatus("Connecting to: " + serverUrl);

  ws = new WebSocket(serverUrl);

  ws.onopen = () => {
    clearError();

    send({
      type: "join",
      role,
      room
    });

    setStatus("Connected to PC tunnel server");
  };

  ws.onerror = (err) => {
    console.error("WebSocket error:", err);
    setError("WebSocket error. Check tunnel URL and server.js.");
  };

  ws.onclose = () => {
    setStatus("Disconnected from PC tunnel server");
  };

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "joined") {
      if (role === "tablet") {
        setStatus("Tablet connected. Press Start Tablet Screen.");

        startTabletBtn.style.display = "inline-block";

        const clientUrl =
          window.location.origin +
          window.location.pathname +
          "?role=client" +
          "&room=" +
          encodeURIComponent(room) +
          "&server=" +
          encodeURIComponent(serverUrl);

        qrTitle.style.display = "block";
        qrCanvas.style.display = "block";

        QRCode.toCanvas(qrCanvas, clientUrl, function (error) {
          if (error) {
            console.error(error);
            setError("QR generation failed");
          }
        });
      }

      if (role === "client") {
        setStatus("Client connected. Waiting for tablet stream...");
      }
    }

    if (msg.type === "client-joined") {
      if (role === "tablet") {
        if (localStream) {
          await createOfferForClient(msg.clientId);
        } else {
          waitingClients.add(msg.clientId);
          setStatus("Client joined. Start tablet screen to stream.");
        }
      }
    }

    if (msg.type === "offer") {
      if (role === "client") {
        await receiveOffer(msg.offer);
      }
    }

    if (msg.type === "answer") {
      if (role === "tablet") {
        const pc = peers[msg.clientId];

        if (pc) {
          await pc.setRemoteDescription(msg.answer);
        }
      }
    }

    if (msg.type === "ice") {
      if (role === "tablet") {
        const pc = peers[msg.clientId];

        if (pc && msg.candidate) {
          try {
            await pc.addIceCandidate(msg.candidate);
          } catch (err) {
            console.error("Tablet ICE error:", err);
          }
        }
      }

      if (role === "client") {
        const pc = peers.main;

        if (pc && msg.candidate) {
          try {
            await pc.addIceCandidate(msg.candidate);
          } catch (err) {
            console.error("Client ICE error:", err);
          }
        }
      }
    }

    if (msg.type === "client-left") {
      if (role === "tablet") {
        waitingClients.delete(msg.clientId);

        const pc = peers[msg.clientId];

        if (pc) {
          pc.close();
          delete peers[msg.clientId];
        }
      }
    }
  };
}

async function startTabletScreen() {
  clearError();

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      setError(
        "Screen sharing is not supported in this browser/device.\n" +
        "Try Chrome/Edge on desktop/tablet. Some mobile browsers block getDisplayMedia."
      );
      return;
    }

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: 30
      },
      audio: false
    });

    localVideo.srcObject = localStream;
    localVideo.style.display = "block";

    localStream.getVideoTracks()[0].onended = () => {
      setStatus("Screen sharing stopped");
      localStream = null;

      Object.keys(peers).forEach(id => {
        peers[id].close();
        delete peers[id];
      });
    };

    setStatus("Tablet screen sharing active. Clients can scan QR.");

    for (const clientId of waitingClients) {
      await createOfferForClient(clientId);
    }

    waitingClients.clear();

  } catch (err) {
    console.error("Screen share error:", err);

    setError(
      "Screen share failed.\n\n" +
      "Reason: " + (err.message || err.name || err)
    );
  }
}

async function createOfferForClient(clientId) {
  if (!localStream) {
    waitingClients.add(clientId);
    setStatus("Client joined, but tablet screen is not started yet.");
    return;
  }

  if (peers[clientId]) {
    peers[clientId].close();
    delete peers[clientId];
  }

  const pc = new RTCPeerConnection(rtcConfig);
  peers[clientId] = pc;

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      send({
        type: "ice",
        clientId,
        candidate: event.candidate
      });
    }
  };

  pc.onconnectionstatechange = () => {
    console.log("Client", clientId, "state:", pc.connectionState);

    if (pc.connectionState === "connected") {
      setStatus("Streaming to client: " + clientId);
    }

    if (pc.connectionState === "failed") {
      setError("P2P failed for client " + clientId + ". This network may require TURN.");
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  send({
    type: "offer",
    clientId,
    offer
  });

  setStatus("Sending tablet screen to client: " + clientId);
}

async function receiveOffer(offer) {
  clearError();

  if (peers.main) {
    peers.main.close();
    delete peers.main;
  }

  const pc = new RTCPeerConnection(rtcConfig);
  peers.main = pc;

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
    remoteVideo.style.display = "block";
    setStatus("Receiving tablet screen");
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      send({
        type: "ice",
        candidate: event.candidate
      });
    }
  };

  pc.onconnectionstatechange = () => {
    console.log("Client WebRTC state:", pc.connectionState);

    if (pc.connectionState === "connected") {
      setStatus("P2P stream connected");
    }

    if (pc.connectionState === "failed") {
      setError("P2P failed. This network may require TURN.");
    }

    if (pc.connectionState === "disconnected") {
      setStatus("P2P disconnected");
    }
  };

  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  send({
    type: "answer",
    answer
  });
}

startTabletBtn.onclick = startTabletScreen;

if (!role || !serverUrl) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
