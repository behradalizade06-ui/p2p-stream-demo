<!DOCTYPE html>
<html>
<head>
  <title>Tunnel Tablet Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #070b0a;
      --panel: #101715;
      --panel2: #16211e;
      --green: #00b050;
      --green2: #19d36f;
      --green3: #00853e;
      --text: #ffffff;
      --muted: #a8b8b2;
      --danger: #ff5c5c;
      --border: rgba(255,255,255,0.1);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(0,176,80,0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,176,80,0.10), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 22px rgba(0,176,80,0.85);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 42px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }

    .status {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(0,176,80,0.10);
      border: 1px solid rgba(0,176,80,0.25);
      color: var(--green2);
      font-weight: 800;
      white-space: pre-wrap;
    }

    .error {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,92,92,0.10);
      border: 1px solid rgba(255,92,92,0.25);
      color: var(--danger);
      font-weight: 800;
      white-space: pre-wrap;
      display: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--green3));
      box-shadow: 0 12px 28px rgba(0,176,80,0.28);
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.danger {
      background: linear-gradient(135deg, #ff5c5c, #b51f1f);
    }

    input {
      width: 100%;
      padding: 15px 16px;
      margin: 8px 0 12px;
      font-size: 15px;
      color: white;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
    }

    input:focus {
      border-color: rgba(0,176,80,0.75);
      box-shadow: 0 0 0 4px rgba(0,176,80,0.14);
    }

    p {
      color: var(--muted);
      margin: 0 0 8px;
    }

    .viewer {
      margin-top: 16px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      min-height: 220px;
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video,
    img {
      width: 100%;
      height: auto;
      max-height: 78dvh;
      background: #000;
      display: block;
      object-fit: contain;
    }

    #remoteImage {
      transform-origin: center center;
      transition: transform 0.2s ease;
    }

    #qrWrap {
      margin-top: 16px;
      display: none;
    }

    #qrBox {
      display: inline-block;
      padding: 16px;
      border-radius: 22px;
      background: white;
    }

    #captureCanvas {
      display: none;
    }

    .viewer-toolbar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 999999;
      display: none;
      gap: 8px;
      justify-content: center;
      pointer-events: auto;
    }

    .viewer-toolbar button {
      padding: 11px 14px;
      font-size: 13px;
      background: rgba(0,176,80,0.92);
      backdrop-filter: blur(10px);
    }

    .viewer:fullscreen {
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border-radius: 0;
      border: 0;
      background: #000;
      display: flex !important;
    }

    .viewer:fullscreen img,
    .viewer:fullscreen video {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      object-fit: contain;
      background: #000;
    }

    .viewer.fullscreen-fallback {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 99999;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #000;
      display: flex !important;
    }

    .viewer.fullscreen-fallback img,
    .viewer.fullscreen-fallback video {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      object-fit: contain;
    }

    .viewer.cover img,
    .viewer.cover video {
      object-fit: cover;
    }

    .rotated {
      transform: rotate(90deg);
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: contain;
    }

    .viewer.cover .rotated {
      object-fit: cover;
    }

    @media (orientation: portrait) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .viewer {
        min-height: 60dvh;
      }

      video,
      img {
        max-height: 72dvh;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <div class="header">
    <div>
      <div class="brand">
        <div class="dot"></div>
        <h1>Screen Stream</h1>
      </div>
      <div class="subtitle">Tunnel viewer · dark minimal interface</div>
    </div>

    <button class="secondary" onclick="enterViewerFullscreen()">Fullscreen</button>
  </div>

  <div class="panel">
    <div id="status" class="status">Loading...</div>
    <div id="error" class="error"></div>

    <div id="setupBox" class="panel" style="display:none;">
      <p>Paste Cloudflare tunnel URL:</p>

      <input
        id="serverInput"
        placeholder="https://xxxxx.trycloudflare.com OR wss://xxxxx.trycloudflare.com"
      >

      <div class="controls">
        <button onclick="openAsTablet()">Open as Tablet</button>
        <button class="secondary" onclick="openAsClient()">Open as Client</button>
      </div>
    </div>

    <div class="controls">
      <button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>
      <button id="stopTabletBtn" class="danger" style="display:none;">Stop Stream</button>
      <button id="fullscreenBtn" class="secondary" style="display:none;" onclick="enterViewerFullscreen()">Fullscreen</button>
      <button id="rotateBtn" class="secondary" style="display:none;" onclick="toggleRotate()">Rotate View</button>
      <button id="fitBtn" class="secondary" style="display:none;" onclick="toggleFit()">Fit: Contain</button>
    </div>

    <div id="qrWrap">
      <h3>Client QR</h3>
      <div id="qrBox">
        <canvas id="qr"></canvas>
      </div>
    </div>

    <div id="localViewer" class="viewer">
      <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <div id="remoteViewer" class="viewer">
      <img id="remoteImage" alt="Remote tablet screen">
    </div>

    <canvas id="captureCanvas"></canvas>
  </div>
</div>

<div id="viewerToolbar" class="viewer-toolbar">
  <button onclick="exitViewerFullscreen()">Exit</button>
  <button onclick="toggleRotate()">Rotate</button>
  <button onclick="toggleFit()">Fit</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
let serverUrl = params.get("server");

const setupBox = document.getElementById("setupBox");
const serverInput = document.getElementById("serverInput");

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startTabletBtn = document.getElementById("startTabletBtn");
const stopTabletBtn = document.getElementById("stopTabletBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const rotateBtn = document.getElementById("rotateBtn");
const fitBtn = document.getElementById("fitBtn");

const qrWrap = document.getElementById("qrWrap");
const qrCanvas = document.getElementById("qr");

const localViewer = document.getElementById("localViewer");
const remoteViewer = document.getElementById("remoteViewer");
const viewerToolbar = document.getElementById("viewerToolbar");

const localVideo = document.getElementById("localVideo");
const remoteImage = document.getElementById("remoteImage");

const captureCanvas = document.getElementById("captureCanvas");
const captureCtx = captureCanvas.getContext("2d");

let ws = null;
let localStream = null;
let frameTimer = null;

let rotated = false;
let coverMode = false;
let fallbackFullscreen = false;

const FPS = 5;
const JPEG_QUALITY = 0.55;
const MAX_WIDTH = 960;

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  if (!text) {
    errorBox.style.display = "none";
    errorBox.innerText = "";
    return;
  }

  errorBox.style.display = "block";
  errorBox.innerText = text;
}

function clearError() {
  setError("");
}

function normalizeServerUrl(url) {
  if (!url) return null;

  url = url.trim();

  if (url.startsWith("https://")) {
    return url.replace("https://", "wss://");
  }

  if (url.startsWith("http://")) {
    return url.replace("http://", "ws://");
  }

  if (url.startsWith("wss://") || url.startsWith("ws://")) {
    return url;
  }

  return "wss://" + url;
}

function buildUrl(newRole) {
  const cleanServer = normalizeServerUrl(serverInput.value);

  if (!cleanServer) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(cleanServer)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function sendJson(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

async function enterViewerFullscreen() {
  const viewer = role === "tablet" ? localViewer : remoteViewer;

  viewer.style.display = "flex";
  viewerToolbar.style.display = "flex";

  try {
    if (viewer.requestFullscreen) {
      await viewer.requestFullscreen();
    } else {
      throw new Error("Fullscreen API unavailable");
    }
  } catch (err) {
    fallbackFullscreen = true;
    viewer.classList.add("fullscreen-fallback");
  }

  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("portrait");
    }
  } catch (e) {
    console.log("Orientation lock not available");
  }
}

async function exitViewerFullscreen() {
  viewerToolbar.style.display = "none";

  if (document.fullscreenElement) {
    await document.exitFullscreen();
  }

  localViewer.classList.remove("fullscreen-fallback");
  remoteViewer.classList.remove("fullscreen-fallback");
  fallbackFullscreen = false;
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    viewerToolbar.style.display = "none";
    localViewer.classList.remove("fullscreen-fallback");
    remoteViewer.classList.remove("fullscreen-fallback");
    fallbackFullscreen = false;
  } else {
    viewerToolbar.style.display = "flex";
  }
});

function toggleRotate() {
  rotated = !rotated;

  if (rotated) {
    remoteImage.classList.add("rotated");
    localVideo.classList.add("rotated");
  } else {
    remoteImage.classList.remove("rotated");
    localVideo.classList.remove("rotated");
  }
}

function toggleFit() {
  coverMode = !coverMode;

  localViewer.classList.toggle("cover", coverMode);
  remoteViewer.classList.toggle("cover", coverMode);

  fitBtn.innerText = coverMode ? "Fit: Cover" : "Fit: Contain";
}

function connectWebSocket() {
  if (!serverUrl) {
    setupBox.style.display = "block";
    setStatus("Insert tunnel URL and choose Tablet or Client");
    return;
  }

  serverUrl = normalizeServerUrl(serverUrl);

  setStatus("Connecting to tunnel:\n" + serverUrl);

  ws = new WebSocket(serverUrl);

  ws.onopen = () => {
    clearError();

    sendJson({
      type: "join",
      role: role,
      room: room
    });

    setStatus("Connected to tunnel server");
  };

  ws.onerror = () => {
    setError("WebSocket error. Check tunnel and server.");
  };

  ws.onclose = () => {
    setStatus("Disconnected from tunnel server");
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "joined") {
      if (role === "tablet") {
        initTabletUi();
      }

      if (role === "client") {
        setStatus("Client connected. Waiting for stream...");
        fullscreenBtn.style.display = "inline-block";
        rotateBtn.style.display = "inline-block";
        fitBtn.style.display = "inline-block";
      }
    }

    if (msg.type === "stream-start") {
      if (role === "client") {
        remoteViewer.style.display = "flex";
        fullscreenBtn.style.display = "inline-block";
        rotateBtn.style.display = "inline-block";
        fitBtn.style.display = "inline-block";
        setStatus("Receiving screen through tunnel...");
      }
    }

    if (msg.type === "frame") {
      if (role === "client") {
        remoteImage.src = msg.dataUrl;
        remoteViewer.style.display = "flex";
      }
    }

    if (msg.type === "stream-stop") {
      if (role === "client") {
        remoteImage.removeAttribute("src");
        remoteViewer.style.display = "none";
        setStatus("Stream stopped");
      }
    }
  };
}

function initTabletUi() {
  setStatus("Tablet connected. Press Start Tablet Screen.");

  startTabletBtn.style.display = "inline-block";
  fullscreenBtn.style.display = "inline-block";
  rotateBtn.style.display = "inline-block";
  fitBtn.style.display = "inline-block";

  const clientUrl =
    window.location.origin +
    window.location.pathname +
    "?role=client" +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(serverUrl);

  qrWrap.style.display = "block";

  QRCode.toCanvas(qrCanvas, clientUrl);
}

async function startTabletScreen() {
  clearError();

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      setError("Screen sharing not supported on this device/browser.");
      return;
    }

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: FPS,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    localVideo.srcObject = localStream;
    localViewer.style.display = "flex";

    await localVideo.play();

    sendJson({
      type: "stream-start"
    });

    startTabletBtn.style.display = "none";
    stopTabletBtn.style.display = "inline-block";

    localStream.getVideoTracks()[0].onended = () => {
      stopTabletStream();
    };

    frameTimer = setInterval(sendFrame, 1000 / FPS);

    setStatus("Streaming screen through tunnel");

  } catch (err) {
    console.error(err);
    setError("Screen share failed:\n" + (err.message || err.name || err));
  }
}

function sendFrame() {
  if (!localVideo.videoWidth || !localVideo.videoHeight) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  let width = localVideo.videoWidth;
  let height = localVideo.videoHeight;

  if (width > MAX_WIDTH) {
    const scale = MAX_WIDTH / width;
    width = MAX_WIDTH;
    height = Math.round(height * scale);
  }

  captureCanvas.width = width;
  captureCanvas.height = height;

  captureCtx.drawImage(localVideo, 0, 0, width, height);

  const dataUrl = captureCanvas.toDataURL("image/jpeg", JPEG_QUALITY);

  sendJson({
    type: "frame",
    dataUrl: dataUrl
  });
}

function stopTabletStream() {
  if (frameTimer) {
    clearInterval(frameTimer);
    frameTimer = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }

  localStream = null;

  sendJson({
    type: "stream-stop"
  });

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";
  localViewer.style.display = "none";

  setStatus("Stream stopped");
}

startTabletBtn.onclick = startTabletScreen;
stopTabletBtn.onclick = stopTabletStream;

if (!role || !serverUrl) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
