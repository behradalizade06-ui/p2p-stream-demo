<!DOCTYPE html>
<html>
<head>
  <title>Tunnel Screen Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #070b0a;
      --green: #00b050;
      --green2: #19d36f;
      --green3: #00853e;
      --text: #ffffff;
      --muted: #a8b8b2;
      --danger: #ff5c5c;
      --border: rgba(255,255,255,0.1);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(0,176,80,0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,176,80,0.10), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 22px rgba(0,176,80,0.85);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 42px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }

    .status {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(0,176,80,0.10);
      border: 1px solid rgba(0,176,80,0.25);
      color: var(--green2);
      font-weight: 800;
      white-space: pre-wrap;
    }

    .error {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,92,92,0.10);
      border: 1px solid rgba(255,92,92,0.25);
      color: var(--danger);
      font-weight: 800;
      white-space: pre-wrap;
      display: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--green3));
      box-shadow: 0 12px 28px rgba(0,176,80,0.28);
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.danger {
      background: linear-gradient(135deg, #ff5c5c, #b51f1f);
    }

    input {
      width: 100%;
      padding: 15px 16px;
      margin: 8px 0 12px;
      font-size: 15px;
      color: white;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
    }

    p {
      color: var(--muted);
      margin: 0 0 8px;
    }

    .viewer {
      margin-top: 16px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      height: 70dvh;
      min-height: 300px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    .viewer:fullscreen {
      width: 100vw;
      height: 100dvh;
      margin: 0;
      border-radius: 0;
      border: 0;
      background: #000;
      display: flex !important;
    }

    .viewer:fullscreen video {
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
    }

    #qrWrap {
      margin-top: 16px;
      display: none;
    }

    #qrBox {
      display: inline-block;
      padding: 16px;
      border-radius: 22px;
      background: white;
    }

    @media (orientation: portrait) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <div class="header">
    <div>
      <div class="brand">
        <div class="dot"></div>
        <h1>Screen Stream</h1>
      </div>
      <div class="subtitle">Compressed video through Cloudflare tunnel</div>
    </div>

    <button class="secondary" onclick="fullscreenViewer()">Fullscreen</button>
  </div>

  <div class="panel">
    <div id="status" class="status">Loading...</div>
    <div id="error" class="error"></div>

    <div id="setupBox" class="panel" style="display:none;">
      <p>Paste Cloudflare tunnel URL:</p>

      <input
        id="serverInput"
        placeholder="https://xxxxx.trycloudflare.com OR wss://xxxxx.trycloudflare.com"
      >

      <div class="controls">
        <button onclick="openAsTablet()">Open as Tablet</button>
        <button class="secondary" onclick="openAsClient()">Open as Client</button>
      </div>
    </div>

    <div class="controls">
      <button id="startTabletBtn" style="display:none;">Start Tablet Screen</button>
      <button id="stopTabletBtn" class="danger" style="display:none;">Stop Stream</button>
      <button id="fullscreenBtn" class="secondary" style="display:none;" onclick="fullscreenViewer()">Fullscreen</button>
      <button id="audioBtn" class="secondary" style="display:none;" onclick="enableAudio()">Enable Audio</button>
    </div>

    <div id="qrWrap">
      <h3>Client QR</h3>
      <div id="qrBox">
        <canvas id="qr"></canvas>
      </div>
    </div>

    <div id="localViewer" class="viewer">
      <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <div id="remoteViewer" class="viewer">
      <video id="remoteVideo" autoplay muted playsinline controls></video>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const role = params.get("role");
const room = params.get("room") || "demo";
let serverUrl = params.get("server");

const setupBox = document.getElementById("setupBox");
const serverInput = document.getElementById("serverInput");

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startTabletBtn = document.getElementById("startTabletBtn");
const stopTabletBtn = document.getElementById("stopTabletBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const audioBtn = document.getElementById("audioBtn");

const qrWrap = document.getElementById("qrWrap");
const qrCanvas = document.getElementById("qr");

const localViewer = document.getElementById("localViewer");
const remoteViewer = document.getElementById("remoteViewer");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

let ws = null;
let localStream = null;
let recorder = null;

let mediaSource = null;
let sourceBuffer = null;
let queue = [];
let sourceOpen = false;
let currentMimeType = null;

function setStatus(text) {
  statusBox.innerText = text;
}

function setError(text) {
  if (!text) {
    errorBox.style.display = "none";
    errorBox.innerText = "";
    return;
  }

  errorBox.style.display = "block";
  errorBox.innerText = text;
}

function normalizeServerUrl(url) {
  if (!url) return null;

  url = url.trim();

  if (url.startsWith("https://")) return url.replace("https://", "wss://");
  if (url.startsWith("http://")) return url.replace("http://", "ws://");
  if (url.startsWith("wss://") || url.startsWith("ws://")) return url;

  return "wss://" + url;
}

function buildUrl(newRole) {
  const cleanServer = normalizeServerUrl(serverInput.value);

  if (!cleanServer) {
    alert("Insert Cloudflare tunnel URL first");
    return null;
  }

  return (
    window.location.origin +
    window.location.pathname +
    "?role=" +
    encodeURIComponent(newRole) +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(cleanServer)
  );
}

function openAsTablet() {
  const url = buildUrl("tablet");
  if (url) window.location.href = url;
}

function openAsClient() {
  const url = buildUrl("client");
  if (url) window.location.href = url;
}

function sendJson(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const length = binary.length;
  const bytes = new Uint8Array(length);

  for (let i = 0; i < length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes.buffer;
}

function blobToBase64(blob) {
  return new Promise(resolve => {
    const reader = new FileReader();

    reader.onloadend = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(",")[1];
      resolve(base64);
    };

    reader.readAsDataURL(blob);
  });
}

function connectWebSocket() {
  if (!serverUrl) {
    setupBox.style.display = "block";
    setStatus("Insert tunnel URL and choose Tablet or Client");
    return;
  }

  serverUrl = normalizeServerUrl(serverUrl);

  setStatus("Connecting to tunnel:\n" + serverUrl);

  ws = new WebSocket(serverUrl);

  ws.onopen = () => {
    sendJson({
      type: "join",
      role,
      room
    });

    setStatus("Connected to tunnel");
  };

  ws.onerror = () => {
    setError("WebSocket error:\n" + serverUrl);
  };

  ws.onclose = (event) => {
    setStatus("Disconnected from tunnel\nCode: " + event.code);
  };

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "joined") {
      if (role === "tablet") {
        initTablet();
      }

      if (role === "client") {
        initClient();
      }
    }

    if (msg.type === "stream-start") {
      if (role === "client") {
        startPlayer(msg.mimeType);
      }
    }

    if (msg.type === "chunk") {
      if (role === "client") {
        appendChunk(msg.data);
      }
    }

    if (msg.type === "stream-stop") {
      if (role === "client") {
        stopPlayer();
      }
    }
  };
}

function initTablet() {
  setStatus("Tablet connected. Press Start Tablet Screen.");
  startTabletBtn.style.display = "inline-block";

  const clientUrl =
    window.location.origin +
    window.location.pathname +
    "?role=client" +
    "&room=" +
    encodeURIComponent(room) +
    "&server=" +
    encodeURIComponent(serverUrl);

  qrWrap.style.display = "block";
  QRCode.toCanvas(qrCanvas, clientUrl);
}

function initClient() {
  setStatus("Client connected. Waiting for stream...");
  fullscreenBtn.style.display = "inline-block";
  audioBtn.style.display = "inline-block";
}

async function startTabletScreen() {
  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: 30,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: true
    });

    localVideo.srcObject = localStream;
    localViewer.style.display = "flex";

    await localVideo.play();

    const supportedTypes = [
      "video/webm;codecs=vp8,opus",
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8",
      "video/webm"
    ];

    let mimeType = "";

    for (const type of supportedTypes) {
      if (MediaRecorder.isTypeSupported(type)) {
        mimeType = type;
        break;
      }
    }

    if (!mimeType) {
      setError("No supported MediaRecorder WebM codec.");
      return;
    }

    sendJson({
      type: "stream-start",
      mimeType
    });

    recorder = new MediaRecorder(localStream, {
      mimeType,
      videoBitsPerSecond: 1800000,
      audioBitsPerSecond: 96000
    });

    recorder.ondataavailable = async (event) => {
      if (!event.data || event.data.size === 0) return;

      const base64 = await blobToBase64(event.data);

      sendJson({
        type: "chunk",
        data: base64
      });
    };

    recorder.onstop = () => {
      sendJson({
        type: "stream-stop"
      });
    };

    localStream.getVideoTracks()[0].onended = () => {
      stopTabletStream();
    };

    recorder.start(500);

    startTabletBtn.style.display = "none";
    stopTabletBtn.style.display = "inline-block";

    setStatus("Streaming compressed video through tunnel");

  } catch (err) {
    setError("Screen share failed:\n" + (err.message || err.name || err));
  }
}

function startPlayer(mimeType) {
  currentMimeType = mimeType;
  queue = [];
  sourceBuffer = null;
  sourceOpen = false;

  if (!window.MediaSource) {
    setError("MediaSource not supported on this browser.");
    return;
  }

  if (!MediaSource.isTypeSupported(mimeType)) {
    setError("Codec not supported on this phone:\n" + mimeType);
    return;
  }

  mediaSource = new MediaSource();

  remoteVideo.src = URL.createObjectURL(mediaSource);
  remoteVideo.muted = true;
  remoteVideo.playsInline = true;
  remoteVideo.autoplay = true;
  remoteViewer.style.display = "flex";

  mediaSource.addEventListener("sourceopen", () => {
    sourceBuffer = mediaSource.addSourceBuffer(mimeType);
    sourceBuffer.mode = "sequence";

    sourceBuffer.addEventListener("updateend", processQueue);

    sourceOpen = true;
    processQueue();

    remoteVideo.play().catch(() => {});
  });

  setStatus("Receiving compressed video through tunnel...");
}

function appendChunk(base64) {
  const buffer = base64ToArrayBuffer(base64);
  queue.push(buffer);
  processQueue();
}

function processQueue() {
  if (!sourceOpen || !sourceBuffer || sourceBuffer.updating || queue.length === 0) {
    return;
  }

  const chunk = queue.shift();

  try {
    sourceBuffer.appendBuffer(chunk);
  } catch (err) {
    setError("Video buffer error:\n" + (err.message || err.name || err));
  }
}

function stopPlayer() {
  queue = [];

  if (remoteVideo.src) {
    URL.revokeObjectURL(remoteVideo.src);
  }

  remoteVideo.removeAttribute("src");
  remoteVideo.load();
  remoteViewer.style.display = "none";

  setStatus("Stream stopped");
}

function stopTabletStream() {
  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }

  recorder = null;
  localStream = null;

  startTabletBtn.style.display = "inline-block";
  stopTabletBtn.style.display = "none";
  localViewer.style.display = "none";

  setStatus("Stream stopped");
}

async function enableAudio() {
  remoteVideo.muted = false;
  remoteVideo.volume = 1;
  await remoteVideo.play();
  setStatus("Audio enabled");
}

async function fullscreenViewer() {
  remoteViewer.style.display = "flex";

  try {
    await remoteViewer.requestFullscreen();
  } catch {}
}

startTabletBtn.onclick = startTabletScreen;
stopTabletBtn.onclick = stopTabletStream;

if (!role || !serverUrl) {
  setupBox.style.display = "block";
  setStatus("Insert tunnel URL and choose Tablet or Client");
} else {
  connectWebSocket();
}
</script>

</body>
</html>
